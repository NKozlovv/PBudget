// Debounced FX rate save (don't hit the DB on every keystroke)
let _fxSaveTimer = null;
document.getElementById('fxRate').addEventListener('input', async (e) => {
  const v = parseFloat(e.target.value);
  if (!isFinite(v) || v <= 0) return;
  state.fxRate = v;
  render();
  clearTimeout(_fxSaveTimer);
  _fxSaveTimer = setTimeout(async () => {
    try { await cloudUpdateBudget({ fxRate: v }); }
    catch (err) { console.error('FX save failed', err); }
  }, 600);
});

document.getElementById('btnFetchFx').addEventListener('click', async () => {
  const btn = document.getElementById('btnFetchFx');
  const original = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const res = await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=EUR');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rate = data && data.rates && data.rates.EUR;
    if (!rate || !isFinite(rate)) throw new Error('Invalid rate');
    state.fxRate = Math.round(rate * 10000) / 10000;
    document.getElementById('fxRate').value = state.fxRate;
    await cloudUpdateBudget({ fxRate: state.fxRate });
    render();
    toast(`Updated: 1 USD = €${state.fxRate.toFixed(4)}`);
  } catch (err) {
    toast('Could not fetch live rate — ' + err.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
});

const sb = supabase.createClient(
  window.LEDGER_CONFIG.SUPABASE_URL,

);

let currentUser = null;

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  return currentUser;
}

function renderAuthScreen(mode = 'login') {
  const isSignup = mode === 'signup';
  document.body.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark" style="width:36px;height:36px;font-size:14px">€</span>
          Ledger
        </div>
        <div class="auth-tag">Personal budget, shared or solo.</div>
        <form class="auth-form" onsubmit="return false">
          <label>Email</label>
          <input type="email" id="authEmail" autocomplete="email" required>
          <label>Password</label>
          <input type="password" id="authPassword" autocomplete="${isSignup ? 'new-password' : 'current-password'}" required minlength="6">
          <button class="btn btn-primary auth-submit" id="authSubmit">
            ${isSignup ? 'Create account' : 'Sign in'}
          </button>
          <div id="authMsg"></div>
        </form>
        <div class="auth-switch">
          ${isSignup
            ? `Already have an account? <a onclick="renderAuthScreen('login')">Sign in</a>`
            : `New here? <a onclick="renderAuthScreen('signup')">Create an account</a>`}
        </div>
        ${!isSignup ? `<div class="auth-switch" style="margin-top:8px"><a onclick="sendPasswordReset()">Forgot password?</a></div>` : ''}
      </div>
    </div>
  `;

  const submitBtn = document.getElementById('authSubmit');
  submitBtn.onclick = async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const msgEl = document.getElementById('authMsg');
    msgEl.innerHTML = '';
    if (!email || !password) { msgEl.innerHTML = '<div class="auth-error">Email and password required</div>'; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = '…';

    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          // Email confirmation is required
          msgEl.innerHTML = '<div class="auth-notice">Check your inbox to confirm your email, then sign in.</div>';
          submitBtn.textContent = 'Create account';
          submitBtn.disabled = false;
          return;
        }
        // Logged in immediately (confirm email off)
        currentUser = data.user;
        await bootMainApp();
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        await bootMainApp();
      }
    } catch (err) {
      msgEl.innerHTML = `<div class="auth-error">${err.message || 'Something went wrong'}</div>`;
      submitBtn.textContent = isSignup ? 'Create account' : 'Sign in';
      submitBtn.disabled = false;
    }
  };

  // Enter submits
  ['authEmail', 'authPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') submitBtn.click();
    });
  });
}

async function sendPasswordReset() {
  const email = (document.getElementById('authEmail') || {}).value;
  if (!email) { toast('Enter your email first'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  const msgEl = document.getElementById('authMsg');
  if (error) {
    msgEl.innerHTML = `<div class="auth-error">${error.message}</div>`;
  } else {
    msgEl.innerHTML = `<div class="auth-notice">Reset link sent to ${email}</div>`;
  }
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null;
  location.reload();
}

// ---- Budget bootstrap ----
// Loads ALL budgets the user is a member of; creates a default one if none exist.
// Returns the budget to activate (first owned, else first available).
async function ensureBudget() {
  const { data: memberships, error: mErr } = await sb
    .from('budget_members')
    .select('budget_id, role, budgets(id, name, fx_rate, base_currency, owner_id)')
    .eq('user_id', currentUser.id);

  if (mErr) throw mErr;

  if (memberships && memberships.length > 0) {
    const all = memberships.map(m => ({
      id: m.budgets.id,
      name: m.budgets.name,
      fxRate: parseFloat(m.budgets.fx_rate),
      baseCurrency: m.budgets.base_currency,
      ownerId: m.budgets.owner_id,
      role: m.role,
    }));
    state.budgets = all.map(b => ({ id: b.id, name: b.name, ownerId: b.ownerId }));
    // Prefer last used (stored in sessionStorage), else first owned, else first
    const lastId = sessionStorage.getItem('ledger_active_budget');
    const active = (lastId && all.find(b => b.id === lastId))
      || all.find(b => b.ownerId === currentUser.id)
      || all[0];
    return active;
  }

  // None exist → create default budget for this user
  const { data: newBudget, error: bErr } = await sb
    .from('budgets')
    .insert({ name: 'My Budget', owner_id: currentUser.id, fx_rate: 0.854, base_currency: 'EUR' })
    .select().single();
  if (bErr) throw bErr;
  const b = { id: newBudget.id, name: newBudget.name, fxRate: parseFloat(newBudget.fx_rate), baseCurrency: newBudget.base_currency, ownerId: newBudget.owner_id };
  state.budgets = [{ id: b.id, name: b.name, ownerId: b.ownerId }];
  return b;
}

// ---- Budget switcher UI ----
function updateBudgetSwitcherUI() {
  const wrap = document.getElementById('budgetSwitcherWrap');
  const label = document.getElementById('budgetSwitcherLabel');
  const list = document.getElementById('budgetDropdownList');
  if (!wrap || !label || !list) return;

  wrap.style.display = '';
  label.textContent = state.budgetName || 'My Budget';

  list.innerHTML = state.budgets.map(b => `
    <div class="budget-dropdown-item ${b.id === state.budgetId ? 'active' : ''}" onclick="closeBudgetDropdown();switchBudget('${b.id}')">
      <span>${escapeHtml(b.name)}</span>
      ${b.id === state.budgetId ? '<span class="check">✓</span>' : ''}
    </div>`).join('');
}

function toggleBudgetDropdown() {
  const btn = document.getElementById('budgetSwitcherBtn');
  const dd = document.getElementById('budgetDropdown');
  const isOpen = dd.classList.contains('open');
  if (isOpen) { closeBudgetDropdown(); return; }
  btn.classList.add('open');
  dd.classList.add('open');
  // Close on outside click
  setTimeout(() => document.addEventListener('click', _closeBudgetDropdownOnOutside), 0);
}

function closeBudgetDropdown() {
  document.getElementById('budgetSwitcherBtn')?.classList.remove('open');
  document.getElementById('budgetDropdown')?.classList.remove('open');
  document.removeEventListener('click', _closeBudgetDropdownOnOutside);
}

function _closeBudgetDropdownOnOutside(e) {
  const wrap = document.getElementById('budgetSwitcherWrap');
  if (wrap && !wrap.contains(e.target)) closeBudgetDropdown();
}

async function switchBudget(id) {
  if (id === state.budgetId) return;
  const main = document.getElementById('main');
  if (main) main.innerHTML = '<div class="empty"><h2>Loading…</h2></div>';
  try {
    const { data: bData, error } = await sb.from('budgets').select('*').eq('id', id).single();
    if (error) throw error;
    state.budgetId = bData.id;
    state.budgetName = bData.name;
    state.fxRate = parseFloat(bData.fx_rate);
    state.baseCurrency = bData.base_currency;
    state.activeView = 'dashboard';
    state.txFilters = { month: 'all', category: 'all', subcategory: 'all', account: 'all', type: 'all', search: '' };
    sessionStorage.setItem('ledger_active_budget', id);
    document.getElementById('fxRate').value = state.fxRate;
    await loadBudgetData(id);
    updateBudgetSwitcherUI();
    render();
    toast(`Switched to "${bData.name}"`);
  } catch (err) {
    toast('Failed to switch budget: ' + err.message);
  }
}

async function createBudget() {
  const name = prompt('New budget name:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  try {
    const { data: b, error } = await sb
      .from('budgets')
      .insert({ name: trimmed, owner_id: currentUser.id, fx_rate: state.fxRate, base_currency: 'EUR' })
      .select().single();
    if (error) throw error;
    state.budgets.push({ id: b.id, name: b.name, ownerId: b.owner_id });
    toast(`Created "${b.name}" — switching…`);
    await switchBudget(b.id);
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function renameBudget() {
  const current = state.budgets.find(b => b.id === state.budgetId);
  if (!current || current.ownerId !== currentUser.id) { toast('Only the owner can rename this budget'); return; }
  const name = prompt('Rename budget:', current.name);
  if (!name || !name.trim() || name.trim() === current.name) return;
  const trimmed = name.trim();
  try {
    const { error } = await sb.from('budgets').update({ name: trimmed }).eq('id', state.budgetId);
    if (error) throw error;
    current.name = trimmed;
    state.budgetName = trimmed;
    updateBudgetSwitcherUI();
    toast('Renamed');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function processPendingInvites() {
  // For existing users: check if they have pending invites and auto-accept them client-side.
  // (The DB trigger only fires for brand-new signups.)
  if (!currentUser?.email) return;
  try {
    const { data: pending } = await sb.from('budget_invites')
      .select('id, budget_id')
      .ilike('email', currentUser.email);
    if (!pending || pending.length === 0) return;

    for (const inv of pending) {
      await sb.from('budget_members').insert(
        { budget_id: inv.budget_id, user_id: currentUser.id, role: 'member' }
      );
      await sb.from('budget_invites').delete().eq('id', inv.id);
    }

    // Refresh budget list so newly joined budgets appear in the switcher
    const { data: memberships } = await sb
      .from('budget_members')
      .select('budget_id, role, budgets(id, name, owner_id)')
      .eq('user_id', currentUser.id);
    if (memberships) {
      state.budgets = memberships.map(m => ({
        id: m.budgets.id, name: m.budgets.name, ownerId: m.budgets.owner_id
      }));
      updateBudgetSwitcherUI();
      if (pending.length === 1) toast('You\'ve been added to a shared budget!');
      else toast(`You\'ve been added to ${pending.length} shared budgets!`);
    }
  } catch (_) { /* non-critical */ }
}

async function sendInvite() {
  const input = document.getElementById('inviteEmailInput');
  const msgEl = document.getElementById('inviteMsg');
  const email = (input?.value || '').trim().toLowerCase();
  if (!email || !email.includes('@')) {
    if (msgEl) msgEl.textContent = 'Enter a valid email address.';
    return;
  }
  if (email === currentUser.email.toLowerCase()) {
    if (msgEl) msgEl.textContent = 'That\'s your own email.';
    return;
  }
  if (msgEl) { msgEl.textContent = 'Sending…'; msgEl.style.color = 'var(--ink-mute)'; }
  try {
    const session = (await sb.auth.getSession()).data.session;
    const res = await fetch(`${window.LEDGER_CONFIG.SUPABASE_URL}/functions/v1/send-budget-invite`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
        'apikey': window.LEDGER_CONFIG.SUPABASE_KEY,
      },
      body: JSON.stringify({ email, budget_id: state.budgetId, budget_name: state.budgetName }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
    if (input) input.value = '';
    if (msgEl) { msgEl.textContent = `Invite sent to ${email} — they'll get an email with a sign-in link.`; msgEl.style.color = 'var(--success)'; }
    await openManageMembers();
  } catch (err) {
    if (msgEl) { msgEl.textContent = 'Failed: ' + err.message; msgEl.style.color = 'var(--red)'; }
  }
}

async function revokeAccess(userId) {
  if (!confirm('Remove this member from the budget?')) return;
  try {

// ---- Load all data for a budget into state ----
async function loadBudgetData(budgetId) {
  // Accounts
  const { data: accounts, error: aErr } = await sb
    .from('accounts')
    .select('*')
    .eq('budget_id', budgetId)
    .order('sort_order', { ascending: true });
  if (aErr) throw aErr;

  state.accounts = (accounts || []).map(a => ({
    id: a.id,
    name: a.name,
    currency: a.currency,
  }));
  state.openingBalances = {};
  (accounts || []).forEach(a => { state.openingBalances[a.id] = parseFloat(a.opening_balance) || 0; });

  // Categories (expense + income)
  const { data: cats, error: cErr } = await sb
    .from('categories')
    .select('*, subcategories(*)')
    .eq('budget_id', budgetId)
    .order('sort_order', { ascending: true });
  if (cErr) throw cErr;

  state.categories = {};
  state.incomeTypes = [];
  (cats || []).forEach(c => {
    if (c.kind === 'expense') {
      state.categories[c.name] = (c.subcategories || [])
        .sort((a, b) => a.sort_order - b.sort_order)
        .map(s => s.name);
    } else {
      state.incomeTypes.push(c.name);
    }
  });
  if (state.incomeTypes.length === 0) {
    state.incomeTypes = ['Salary', 'Reimbursement', 'Account adjustment'];
  }

  // Transactions
  const { data: txs, error: tErr } = await sb
    .from('transactions')
    .select('*')
    .eq('budget_id', budgetId)
    .order('date', { ascending: false });
  if (tErr) throw tErr;

  state.transactions = (txs || []).map(t => ({
    id: t.id,
    date: t.date,
    type: t.type,
    amount: parseFloat(t.amount),
    currency: t.currency,
    fx_rate: t.fx_rate != null ? parseFloat(t.fx_rate) : null,
    category: t.category || '',
    subcategory: t.subcategory || '',
    account: t.account_id,
    comment: t.comment || '',
  }));

  state.hasData = state.accounts.length > 0 || state.transactions.length > 0;
}

let _csvParsed = []; // [{date,merchant,amount,include,category,subcategory,dateRaw}]

function parseSemicolonLine(line) {
  const fields = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && !inQ) { inQ = true; }
    else if (c === '"' && inQ) {
      if (line[i+1] === '"') { cur += '"'; i++; }
      else inQ = false;
    } else if (c === ';' && !inQ) { fields.push(cur); cur = ''; }
    else cur += c;
  }
  fields.push(cur);
  return fields;
}

function parseDateFromVZ(vz) {
  // look for ISO datetime like 2026-04-24T16:22
  const m = vz.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

function parseGermanDate(s) {
  // DD.MM.YY or DD.MM.YYYY
  const m = s.match(/^(\d{2})\.(\d{2})\.(\d{2,4})$/);
  if (!m) return null;
  let y = parseInt(m[3]);
  if (y < 100) y += 2000;
  const mo = m[2].padStart(2,'0');
  const d = m[1].padStart(2,'0');
  return `${y}-${mo}-${d}`;
}

function parseEuroAmount(s) {
  // "−26,14" or "-26,14" or "1.234,56"
  const clean = s.replace(/−/g,'-').replace(/\./g,'').replace(',','.');
  return parseFloat(clean);
}

function cleanMerchant(s) {
  // "Kaufland Bad Aibling//Bad Aibling/DE" → "Kaufland Bad Aibling"
  return s.replace(/\/\/.*/,'').replace(/\s+/,' ').trim();
}

function parseSparkasseCSV(text, filterMonth, filterYear) {
  // strip BOM
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  // find header row (contains "Buchungstag")
  let headerIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].includes('Buchungstag')) { headerIdx = i; break; }
  }
  if (headerIdx < 0) return [];

  const headers = parseSemicolonLine(lines[headerIdx]).map(h => h.trim());
  const col = name => headers.indexOf(name);
  const iB = col('Buchungstag');
  const iV = col('Valutadatum');
  const iVZ = col('Verwendungszweck');
  const iBeg = col('Beguenstigter/Zahlungspflichtiger');
  const iBet = col('Betrag');

  const rows = [];
  for (let i = headerIdx + 1; i < lines.length; i++) {
    const f = parseSemicolonLine(lines[i]);
    if (f.length < 5) continue;

    const betragStr = f[iBet] ? f[iBet].trim() : '';
    if (!betragStr) continue;
    const amount = parseEuroAmount(betragStr);
    if (isNaN(amount)) continue;

    const vz = iVZ >= 0 ? (f[iVZ] || '').trim() : '';
    const buchTag = iB >= 0 ? (f[iB] || '').trim() : '';
    const valuta = iV >= 0 ? (f[iV] || '').trim() : '';
    // resolve date
    let dateISO = parseDateFromVZ(vz) || parseGermanDate(valuta) || parseGermanDate(buchTag) || null;

    // filter by month if specified
    if (filterMonth !== null && dateISO) {
      const parts = dateISO.split('-');
      const txYear = parseInt(parts[0]);
      const txMonth = parseInt(parts[1]) - 1; // 0-based
      if (txYear !== filterYear || txMonth !== filterMonth) continue;
    }

    const beg = iBeg >= 0 ? (f[iBeg] || '').trim() : '';
    const merchant = cleanMerchant(beg) || vz.slice(0, 60) || 'Unknown';

    rows.push({
      date: dateISO || '',
      dateRaw: buchTag,
      merchant,
      amount,
      include: true,
      category: '',
      subcategory: '',
    });
  }
  return rows;
}

function handleCSVDrop(e) {
  const f = e.dataTransfer.files[0];
  if (f) handleCSVFile(f);

function handleCSVFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    _csvFileText = e.target.result;
    document.getElementById('csvFileName').textContent = file.name;
    document.getElementById('csvStep1Next').disabled = false;
  };
  // try UTF-8 first; Sparkasse sometimes uses latin-1 but modern exports are UTF-8
  reader.readAsText(file, 'UTF-8');
}

function csvStep1Next() {
  if (!_csvFileText) return;
  const month = parseInt(document.getElementById('csvMonth').value);
  const year = parseInt(document.getElementById('csvYear').value);
  const accountId = document.getElementById('csvAccount').value;
  _csvParsed = parseSparkasseCSV(_csvFileText, month, year);
  if (_csvParsed.length === 0) {
    toast('No transactions found for that month — check file or try a different month');
    return;
  }
  document.getElementById('csvStep1Modal').remove();
  showCSVReview(_csvParsed, accountId, month, year);
}

function showCSVReview(rows, accountId, month, year) {
  const acc = state.accounts.find(a => a.id === accountId);
  const catOpts = Object.keys(state.categories).map(c =>
    `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`
  ).join('');

  const buildRows = () => rows.map((r, i) => {
    const subOpts = r.category && state.categories[r.category]
      ? state.categories[r.category].map(s => `<option value="${escapeHtml(s)}" ${r.subcategory===s?'selected':''}>${escapeHtml(s)}</option>`).join('')
      : '';
    const amtClass = r.amount >= 0 ? 'csv-amount-pos' : 'csv-amount-neg';
    const amtSign = r.amount >= 0 ? '+' : '';
    return `<tr class="${r.include?'':'excluded'}" id="csvRow_${i}">
      <td><input type="checkbox" ${r.include?'checked':''} onchange="_csvToggleRow(${i},this.checked)"></td>
      <td><input class="csv-cell-input" style="width:105px" value="${r.date}" oninput="_csvDate(${i},this.value)"></td>
      <td><input class="csv-cell-input" style="min-width:160px" value="${escapeHtml(r.merchant)}" oninput="_csvMerchant(${i},this.value)"></td>
      <td class="${amtClass}" style="text-align:right;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:12px">${amtSign}${Math.abs(r.amount).toFixed(2)}</td>
      <td>
        <select class="csv-cell-select" style="min-width:130px" onchange="_csvCat(${i},this.value)">
          <option value="">— category —</option>
          ${catOpts.replace(`value="${escapeHtml(r.category)}"`,`value="${escapeHtml(r.category)}" selected`)}
        </select>
      </td>
      <td>
        <select class="csv-cell-select" style="min-width:130px" onchange="_csvSub(${i},this.value)" id="csvSub_${i}">
          <option value="">— sub —</option>
          ${subOpts}
        </select>
      </td>
    </tr>`;
  }).join('');

  const buildBalance = () => {
    const now = new Date();
    const curM = now.getMonth(); const curY = now.getFullYear();
    const currentBal = accountBalanceNative(accountId, curM, curY);
    const included = rows.filter(r => r.include);
    const delta = included.reduce((s, r) => s + r.amount, 0);
    const afterBal = currentBal + delta;
    const deltaClass = delta >= 0 ? 'pos' : 'neg';
    const afterClass = afterBal >= 0 ? '' : 'neg';
    return `
      <div class="csv-balance-item">
        <span class="csv-balance-label">Current balance</span>
        <span class="csv-balance-val">${currentBal.toFixed(2)} ${acc ? acc.currency : 'EUR'}</span>
      </div>
      <div class="csv-balance-item">
        <span class="csv-balance-label">Import total (${included.length} tx)</span>
        <span class="csv-balance-val ${deltaClass}">${delta>=0?'+':''}${delta.toFixed(2)} ${acc ? acc.currency : 'EUR'}</span>
      </div>
      <div class="csv-balance-item">
        <span class="csv-balance-label">Balance after import</span>
        <span class="csv-balance-val ${afterClass}">${afterBal.toFixed(2)} ${acc ? acc.currency : 'EUR'}</span>
      </div>`;
  };

  const monthName = new Date(year, month, 1).toLocaleString('en', {month:'long'});

  const html = `
  <div class="modal-overlay" id="csvReviewModal" onclick="if(event.target===this)this.remove()">
    <div class="modal csv-modal">
      <div class="modal-header">
        <span class="modal-title">Review — ${monthName} ${year} <span style="font-weight:400;color:var(--ink-mute)">(${rows.length} transactions)</span></span>
        <button class="modal-close" onclick="document.getElementById('csvReviewModal').remove()">✕</button>
      </div>
      <div class="modal-body" style="padding-bottom:0">
        <div class="csv-scroll">
          <table class="csv-review-table">
            <thead><tr>
              <th style="width:28px"><input type="checkbox" checked onchange="_csvToggleAll(this.checked)" title="Toggle all"></th>
              <th>Date</th><th>Merchant / note</th><th style="text-align:right">Amount</th>
              <th>Category</th><th>Subcategory</th>
            </tr></thead>
            <tbody id="csvTbody">${buildRows()}</tbody>
          </table>
        </div>
        <div class="csv-balance-bar" id="csvBalanceBar">${buildBalance()}</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="document.getElementById('csvReviewModal').remove()">Cancel</button>
        <button class="btn" onclick="submitCSVImport('${accountId}')">Import transactions</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').insertAdjacentHTML('beforeend', html);
}

function _csvRefreshBalance(accountId) {
  const el = document.getElementById('csvBalanceBar');
  if (!el) return;
  const acc = state.accounts.find(a => a.id === accountId);
  const now = new Date();
  const currentBal = accountBalanceNative(accountId, now.getMonth(), now.getFullYear());
  const included = _csvParsed.filter(r => r.include);
  const delta = included.reduce((s, r) => s + r.amount, 0);
  const afterBal = currentBal + delta;
  const deltaClass = delta >= 0 ? 'pos' : 'neg';
  const afterClass = afterBal >= 0 ? '' : 'neg';
  const cur = acc ? acc.currency : 'EUR';
  el.innerHTML = `
    <div class="csv-balance-item"><span class="csv-balance-label">Current balance</span><span class="csv-balance-val">${currentBal.toFixed(2)} ${cur}</span></div>
    <div class="csv-balance-item"><span class="csv-balance-label">Import total (${included.length} tx)</span><span class="csv-balance-val ${deltaClass}">${delta>=0?'+':''}${delta.toFixed(2)} ${cur}</span></div>
    <div class="csv-balance-item"><span class="csv-balance-label">Balance after import</span><span class="csv-balance-val ${afterClass}">${afterBal.toFixed(2)} ${cur}</span></div>`;
}

function _csvToggleRow(i, checked) {
  _csvParsed[i].include = checked;
  const row = document.getElementById(`csvRow_${i}`);
  if (row) row.classList.toggle('excluded', !checked);
  // re-read accountId from submit button
  const submitBtn = document.querySelector('#csvReviewModal .btn:not(.btn-ghost)');
  const accId = submitBtn ? submitBtn.getAttribute('onclick').match(/'([^']+)'/)?.[1] : null;
  if (accId) _csvRefreshBalance(accId);
}

function _csvToggleAll(checked) {
  _csvParsed.forEach((r, i) => {
    r.include = checked;
    const row = document.getElementById(`csvRow_${i}`);
    if (row) row.classList.toggle('excluded', !checked);
  });
  const submitBtn = document.querySelector('#csvReviewModal .btn:not(.btn-ghost)');
  const accId = submitBtn ? submitBtn.getAttribute('onclick').match(/'([^']+)'/)?.[1] : null;
  if (accId) _csvRefreshBalance(accId);
}

function _csvDate(i, v) { _csvParsed[i].date = v.trim(); }
function _csvMerchant(i, v) { _csvParsed[i].merchant = v; }

function _csvCat(i, v) {
  _csvParsed[i].category = v;
  _csvParsed[i].subcategory = '';
  const subSel = document.getElementById(`csvSub_${i}`);
  if (!subSel) return;
  const subs = (v && state.categories[v]) ? state.categories[v] : [];
  subSel.innerHTML = '<option value="">— sub —</option>' +
    subs.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
}

function _csvSub(i, v) { _csvParsed[i].subcategory = v; }

async function submitCSVImport(accountId) {
  const toImport = _csvParsed.filter(r => r.include);
  if (toImport.length === 0) { toast('Nothing selected to import'); return; }

  const btn = document.querySelector('#csvReviewModal .btn:not(.btn-ghost)');
  if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }

  let ok = 0, fail = 0;
  for (const r of toImport) {
    const amt = Math.abs(r.amount);
    const txType = r.amount < 0 ? 'expense' : 'income';
    const tx = {
      date: r.date || dateToLocalISO(new Date()),
      type: txType,
      amount: amt,
      currency: 'EUR',
      fx_rate: null,
      category: r.category || 'Uncategorized',
      subcategory: r.subcategory || '',
      account: accountId,
      comment: r.merchant,
    };
    try {
      const created = await cloudCreateTx(tx);
      state.transactions.push({ ...tx, id: created.id });
      ok++;
    } catch(e) {
      console.error('CSV import row failed:', e, r);
      fail++;
    }
  }

  document.getElementById('csvReviewModal')?.remove();
  _csvFileText = null;
  _csvParsed = [];
  render();
  toast(`Imported ${ok} transaction${ok!==1?'s':''}${fail ? ` (${fail} failed)` : ''}`);
}

// ---- Bulk import from xlsx ----
// Called after parseXlsx returns `imported`. Writes everything to the cloud.
async function cloudBulkImport(imported) {
  // 1. Accounts — preserve old IDs → new IDs mapping for transaction account refs
  const accMap = {};
  for (let i = 0; i < imported.accounts.length; i++) {
    const a = imported.accounts[i];
    const opening = imported.openingBalances[a.id] || 0;
    const { data, error } = await sb
      .from('accounts')
      .insert({
        budget_id: state.budgetId,
        name: a.name,
        currency: a.currency,
        opening_balance: opening,
        sort_order: i,
      })
      .select()
      .single();
    if (error) throw error;
    accMap[a.id] = data.id;
  }

  // 2. Categories + subcategories
  let catSortOrder = 0;
  for (const [catName, subs] of Object.entries(imported.categories)) {
    const { data: cat, error: e1 } = await sb
      .from('categories')
      .insert({ budget_id: state.budgetId, name: catName, kind: 'expense', sort_order: catSortOrder++ })
      .select()
      .single();
    if (e1) throw e1;
    if (subs && subs.length > 0) {
      const subRows = subs.map((s, i) => ({ category_id: cat.id, name: s, sort_order: i }));
      const { error: e2 } = await sb.from('subcategories').insert(subRows);
      if (e2) throw e2;
    }
  }

  // 3. Income types (as categories with kind='income')
  let incSortOrder = 0;
  for (const name of imported.incomeTypes) {
    const { error } = await sb
      .from('categories')
      .insert({ budget_id: state.budgetId, name, kind: 'income', sort_order: incSortOrder++ });
    if (error && !String(error.message).includes('duplicate')) throw error;
  }

  // 4. Transactions — batch insert in chunks of 200
  const txRows = imported.transactions.map(t => ({
    budget_id: state.budgetId,
    date: t.date,
    type: t.type,
    amount: t.amount,
    currency: t.currency,
    fx_rate: t.fx_rate != null ? t.fx_rate : null,
    category: t.category || null,
    subcategory: t.subcategory || null,
    account_id: accMap[t.account] || null,
    comment: t.comment || null,
    created_by: currentUser ? currentUser.id : null,
  }));

  const CHUNK = 200;
  for (let i = 0; i < txRows.length; i += CHUNK) {
    const batch = txRows.slice(i, i + CHUNK);
    const { error } = await sb.from('transactions').insert(batch);
    if (error) throw error;
  }
}

// ---- Delete all data in the current budget (for reset) ----
async function cloudWipeBudget() {
  if (!state.budgetId) return;
  // Cascades handle subcategories, transactions via FK on delete cascade if set.
  // But our schema doesn't cascade categories → subcategories (they do),
  // and doesn't cascade accounts → transactions. So delete in order:
  await sb.from('transactions').delete().eq('budget_id', state.budgetId);
  await sb.from('accounts').delete().eq('budget_id', state.budgetId);
  await sb.from('categories').delete().eq('budget_id', state.budgetId);
}

// ============================================================
// INIT (auth-gated)
// ============================================================
async function bootMainApp() {
  // Restore the main app HTML that was there originally
  location.reload(); // simplest: reload to get initial HTML, and init() will now pass auth
}

async function init() {
  // Populate version marker
  const vm = document.getElementById('versionMarker');
  if (vm) vm.textContent = `${window.LEDGER_CONFIG.BUILD_VERSION} · ${window.LEDGER_CONFIG.BUILD_DATE}`;

  const user = await checkAuth();
  if (!user) {
    renderAuthScreen('login');
    return;
  }

  // Show a loading pulse while we talk to the cloud
  const main = document.getElementById('main');
  if (main) main.innerHTML = '<div class="empty"><h2>Loading…</h2><p>Fetching your data from the cloud.</p></div>';

  // Add user menu to the topbar
  const topbarActions = document.querySelector('.topbar-actions');
  if (topbarActions && !document.getElementById('userPill')) {
    const pill = document.createElement('span');
    pill.className = 'user-pill';
    pill.id = 'userPill';
    pill.innerHTML = `<strong>${user.email}</strong> <a onclick="signOut()" style="cursor:pointer; color:var(--accent); margin-left:4px">Sign out</a>`;
    topbarActions.insertBefore(pill, topbarActions.firstChild);
  }

  // ---- CLOUD: bootstrap budget + load data ----
  try {
    // Debug: verify the session has a valid access token
    const { data: sessData } = await sb.auth.getSession();
    console.log('[DEBUG] session user id:', sessData?.session?.user?.id);
    console.log('[DEBUG] has access_token:', !!sessData?.session?.access_token);
    console.log('[DEBUG] currentUser.id:', currentUser?.id);

    const budget = await ensureBudget();
    state.budgetId = budget.id;
    state.budgetName = budget.name;
    state.fxRate = budget.fxRate;
    state.baseCurrency = budget.baseCurrency;
    sessionStorage.setItem('ledger_active_budget', budget.id);
    document.getElementById('fxRate').value = state.fxRate;

    await loadBudgetData(budget.id);
    await processPendingInvites();
    updateBudgetSwitcherUI();
  } catch (err) {
    console.error('Cloud bootstrap failed:', err);
    if (main) main.innerHTML = `
      <div class="empty">
        <h2>Couldn't load your data</h2>
        <p>${err.message || 'Unknown error'}. Check your internet and try again.</p>
        <button class="btn" onclick="location.reload()">Retry</button>
      </div>`;
    return;
  }

  render();
}

// Auth state change listener (handles signin/signout in other tabs too)
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentUser = null;
    renderAuthScreen('login');
  }
});

init();

</script>
