<script>
// ============================================================
// STATE
// ============================================================
const STORAGE_KEY = 'ledger-budget-v2';

let state = {
  budgetId: null,     // active budget id (set after login/bootstrap)
  accounts: [],       // [{id, name, currency}]
  categories: {},     // {general: [subcategories]}
  incomeTypes: ['Salary', 'Reimbursement', 'Account adjustment'],
  transactions: [],   // [{id, date, type:'expense'|'income'|'adjustment', amount, currency, category, subcategory, account, comment}]
  openingBalances: {},// {accountId: native-currency-amount}
  fxRate: 0.854,      // 1 USD = X EUR
  baseCurrency: 'EUR',
  activeView: 'dashboard',
  txFilters: { month: 'all', category: 'all', account: 'all', type: 'all', search: '' },
  hasData: false,
};

// ============================================================
// STORAGE
// ============================================================
async function saveState() {
  try {
    const toSave = {
      accounts: state.accounts,
      categories: state.categories,
      incomeTypes: state.incomeTypes,
      transactions: state.transactions,
      openingBalances: state.openingBalances,
      fxRate: state.fxRate,
      baseCurrency: state.baseCurrency,
      hasData: state.hasData,
    };
    if (typeof window !== 'undefined' && window.storage) {
      await window.storage.set(STORAGE_KEY, JSON.stringify(toSave));
    } else {
      // Fallback for local testing
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); } catch(e) {}
    }
  } catch (e) {
    console.error('Save failed:', e);
    toast('Save failed');
  }
}

async function loadState() {
  try {
    if (typeof window !== 'undefined' && window.storage) {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          Object.assign(state, data);
          return true;
        }
      } catch (e) { /* key not found */ }
    } else {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { Object.assign(state, JSON.parse(raw)); return true; }
      } catch(e) {}
    }
  } catch (e) {
    console.error('Load failed:', e);
  }
  return false;
}

// ============================================================
// UTILS
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function fmtEUR(n, opts = {}) {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  const parts = abs.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const prefix = opts.noSymbol ? '' : '€';
  return `${sign}${prefix}${parts.join('.')}`;
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '—';
  const parts = Math.abs(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '−' : '') + parts.join('.');
}

function toEUR(amount, currency) {
  if (!amount) return 0;
  if (currency === 'EUR' || currency === '€') return amount;
  if (currency === 'USD' || currency === '$') return amount * state.fxRate;
  return amount;
}

function monthOfDate(dateStr) {
  const d = new Date(dateStr);
  return d.getMonth(); // 0-11
}
function yearOfDate(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear();
}
function dateStr(d) {
  if (!d) return '';
  if (typeof d === 'string') d = new Date(d);
  return d.toISOString().slice(0, 10);
}
function dateDisplay(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function accountById(id) { return state.accounts.find(a => a.id === id); }
function accountByName(name) { return state.accounts.find(a => a.name === name); }

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ============================================================
// DERIVED DATA
// ============================================================
function currentYear() {
  const years = state.transactions.map(t => yearOfDate(t.date)).filter(y => y > 1900);
  return years.length ? Math.max(...years) : new Date().getFullYear();
}

// Returns account balance IN EUR at end of a given month (0-11) of given year.
// Opening balances are stored in native account currency.
// If month = -1, returns opening balance (in EUR).
function accountBalanceAtMonth(accountId, month, year) {
  const acc = accountById(accountId);
  if (!acc) return 0;
  const openingNative = state.openingBalances[accountId] || 0;
  let balanceEUR = toEUR(openingNative, acc.currency);
  if (month < 0) return balanceEUR;

  state.transactions.forEach(tx => {
    const txDate = new Date(tx.date);
    if (txDate.getFullYear() > year) return;
    if (txDate.getFullYear() === year && txDate.getMonth() > month) return;
    if (tx.account !== accountId) return;
    const amtEUR = toEUR(tx.amount, tx.currency);
    if (tx.type === 'expense') balanceEUR -= amtEUR;
    else if (tx.type === 'income') balanceEUR += amtEUR;
    else if (tx.type === 'adjustment') balanceEUR += amtEUR;
  });
  return balanceEUR;
}

// Returns balance in NATIVE currency (for display like "€3,031.27" on a EUR account, "$5,836" on USD)
function accountBalanceNative(accountId, month, year) {
  const acc = accountById(accountId);
  if (!acc) return 0;
  let balance = state.openingBalances[accountId] || 0;
  if (month < 0) return balance;

  state.transactions.forEach(tx => {
    const txDate = new Date(tx.date);
    if (txDate.getFullYear() > year) return;
    if (txDate.getFullYear() === year && txDate.getMonth() > month) return;
    if (tx.account !== accountId) return;
    // Convert transaction amount to account's currency if needed
    let amt = tx.amount;
    if (tx.currency !== acc.currency) {
      const eur = toEUR(tx.amount, tx.currency);
      amt = acc.currency === 'EUR' ? eur : eur / state.fxRate;
    }
    if (tx.type === 'expense') balance -= amt;
    else if (tx.type === 'income') balance += amt;
    else if (tx.type === 'adjustment') balance += amt;
  });
  return balance;
}

function totalBalanceAtMonth(month, year) {
  return state.accounts.reduce((sum, a) => sum + accountBalanceAtMonth(a.id, month, year), 0);
}

function totalBalanceNow() {
  const y = currentYear();
  return totalBalanceAtMonth(11, y); // end of December = latest
}

// Aggregate expenses/income by month for current year
function monthlyTotals(year) {
  const exp = Array(12).fill(0);
  const inc = Array(12).fill(0);
  state.transactions.forEach(tx => {
    if (yearOfDate(tx.date) !== year) return;
    const m = monthOfDate(tx.date);
    const amt = toEUR(tx.amount, tx.currency);
    if (tx.type === 'expense') exp[m] += amt;
    else if (tx.type === 'income') inc[m] += Math.max(0, amt); // positive income
  });
  return { expenses: exp, income: inc };
}

// Category totals for a given month (or 'all' in year)
function categoryTotals(year, monthFilter) {
  const totals = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense') return;
    if (yearOfDate(tx.date) !== year) return;
    if (monthFilter != null && monthOfDate(tx.date) !== monthFilter) return;
    const amt = toEUR(tx.amount, tx.currency);
    totals[tx.category] = (totals[tx.category] || 0) + amt;
  });
  return totals;
}

function subcategoryTotals(year, monthFilter, category) {
  const totals = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense') return;
    if (tx.category !== category) return;
    if (yearOfDate(tx.date) !== year) return;
    if (monthFilter != null && monthOfDate(tx.date) !== monthFilter) return;
    const amt = toEUR(tx.amount, tx.currency);
    const key = tx.subcategory || '(uncategorised)';
    totals[key] = (totals[key] || 0) + amt;
  });
  return totals;
}

// Forecast: average per-category monthly spend based on COMPLETED months
function forecastSpend(year) {
  const { expenses } = monthlyTotals(year);
  // Last month with any spend = last "actual" month
  let lastActual = -1;
  for (let i = 11; i >= 0; i--) {
    if (expenses[i] > 0) { lastActual = i; break; }
  }
  if (lastActual < 0) return { perCategory: {}, perMonth: Array(12).fill(0), lastActual: -1 };

  const monthsCount = lastActual + 1;

  // Per category: avg monthly for each cat over actual months
  const catTotals = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense') return;
    if (yearOfDate(tx.date) !== year) return;
    const m = monthOfDate(tx.date);
    if (m > lastActual) return;
    const amt = toEUR(tx.amount, tx.currency);
    catTotals[tx.category] = (catTotals[tx.category] || 0) + amt;
  });
  const perCategory = {};
  Object.keys(catTotals).forEach(c => {
    perCategory[c] = { total: catTotals[c], avgMonthly: catTotals[c] / monthsCount };
  });

  // Build projected per-month totals
  const totalAvgMonthly = Object.values(perCategory).reduce((s, v) => s + v.avgMonthly, 0);
  const perMonth = Array(12).fill(0).map((_, i) => i <= lastActual ? expenses[i] : totalAvgMonthly);

  return { perCategory, perMonth, lastActual, monthsCount, totalAvgMonthly };
}

// ============================================================
// XLSX IMPORT
// ============================================================
function parseXlsx(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
  const imported = {
    accounts: [],
    categories: {},
    openingBalances: {},
    transactions: [],
    incomeTypes: ['Salary', 'Reimbursement', 'Account adjustment'],
  };

  // --- Parse Misc sheet for categories & income types ---
  // Row 1 (index 0) = general expense categories (col A-M) + "Account adjustment" (col N) - not a real cat
  // Rows 2+ under each column = subcategories for that category
  // Around row 14 there's an income types list
  if (wb.SheetNames.includes('Misc')) {
    const ws = wb.Sheets['Misc'];
    if (ws['!ref']) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      // Read row 1 (index 0) as category headers
      const catHeaders = [];
      for (let c = 0; c <= Math.min(range.e.c, 20); c++) {
        const cell = ws[XLSX.utils.encode_cell({ r: 0, c })];
        if (cell && cell.v && typeof cell.v === 'string') {
          catHeaders.push({ col: c, name: String(cell.v).trim() });
        }
      }
      // For each real expense category (skip "Account adjustment" which is an income type placeholder)
      catHeaders.forEach(h => {
        if (h.name === 'Account adjustment') return;
        const subs = [];
        for (let r = 1; r <= 12; r++) {
          const cell = ws[XLSX.utils.encode_cell({ r, c: h.col })];
          if (cell && cell.v && typeof cell.v === 'string') {
            const v = String(cell.v).trim();
            if (v && !['Salary', 'Reimbursement', 'Account adjustment'].includes(v)) {
              subs.push(v);
            }
          }
        }
        if (subs.length > 0) imported.categories[h.name] = subs;
        else imported.categories[h.name] = []; // keep empty categories
      });

      // Try to extract income types from rows 13-16 (label 'Income' on left, types across)
      const foundIncomeTypes = new Set();
      for (let r = 12; r <= Math.min(range.e.r, 20); r++) {
        for (let c = 0; c <= 10; c++) {
          const cell = ws[XLSX.utils.encode_cell({ r, c })];
          if (cell && cell.v && typeof cell.v === 'string') {
            const v = String(cell.v).trim();
            if (['Salary', 'Reimbursement', 'Account adjustment'].includes(v)) {
              foundIncomeTypes.add(v);
            }
          }
        }
      }
      if (foundIncomeTypes.size > 0) imported.incomeTypes = Array.from(foundIncomeTypes);
    }
  }

  // --- Parse Accounts Balance sheet ---
  // Structure: row 1 may be blank, row 2 = header (Account | € | $ | Jan..Dec),
  // rows 3+ = one account per row; col B (idx 1) = name, col C (idx 2) = € value,
  // col D (idx 3) = $ value, col E (idx 4) = Jan end-of-month, ..., col P = Dec.
  // The "€" column is the CURRENT balance (latest snapshot), but for OPENING
  // we use what's shown there if January column is empty, OR Jan column if present.
  // To reconstruct opening: opening = current_balance − sum(monthly deltas from transactions)
  // Simpler: take the "€" value as opening balance (user will see current = that,
  // and transactions will re-compute going forward). Better: just use € as opening.
  if (wb.SheetNames.includes('Accounts Balance')) {
    const ws = wb.Sheets['Accounts Balance'];
    // Read sheet with headers at row 2; use raw cell addressing
    const range = XLSX.utils.decode_range(ws['!ref']);
    // Find the header row by looking for 'Account' in column B
    let headerRow = -1;
    for (let r = range.s.r; r <= range.e.r; r++) {
      const cell = ws[XLSX.utils.encode_cell({ r, c: 1 })];
      if (cell && cell.v === 'Account') { headerRow = r; break; }
    }
    if (headerRow >= 0) {
      for (let r = headerRow + 1; r <= range.e.r; r++) {
        const nameCell = ws[XLSX.utils.encode_cell({ r, c: 1 })];
        const eurCell  = ws[XLSX.utils.encode_cell({ r, c: 2 })];
        const usdCell  = ws[XLSX.utils.encode_cell({ r, c: 3 })];
        if (!nameCell || nameCell.v == null) continue;
        const name = String(nameCell.v).trim();
        if (!name || name === 'TOTAL') continue;
        let currency = 'EUR';
        if (name.includes(', $') || name.endsWith('$')) currency = 'USD';
        const id = uid();
        imported.accounts.push({ id, name, currency });
        // Opening balance: for USD accounts use the $ column (native value),
        // for EUR accounts use the € column.
        let opening = 0;
        if (currency === 'USD') {
          if (usdCell && typeof usdCell.v === 'number') opening = usdCell.v;
          else if (eurCell && typeof eurCell.v === 'number') opening = eurCell.v / (state.fxRate || 0.854); // fallback
        } else {
          if (eurCell && typeof eurCell.v === 'number') opening = eurCell.v;
        }
        imported.openingBalances[id] = opening;
      }
    }
  }

  // --- Parse monthly sheets ---
  // Each sheet has row 2 with section headers (Expenses | Income | Accounts Activity)
  // and row 3 with column headers. Data starts at row 4 (1-indexed) = index 3.
  // Expense block:  col B=Date, C=Amount, D=General Cat, E=Sub Cat, F=Comment, G=Account
  // Income block:   col I=Amount, J=Type, K=Comment, L=Account
  MONTHS.forEach((monthName, monthIdx) => {
    if (!wb.SheetNames.includes(monthName)) return;
    const ws = wb.Sheets[monthName];
    if (!ws['!ref']) return;
    const range = XLSX.utils.decode_range(ws['!ref']);

    // Find the header row (contains 'Date' in col B)
    let headerRow = -1;
    for (let r = range.s.r; r <= Math.min(range.s.r + 5, range.e.r); r++) {
      const c = ws[XLSX.utils.encode_cell({ r, c: 1 })];
      if (c && c.v === 'Date') { headerRow = r; break; }
    }
    if (headerRow < 0) headerRow = 2; // fallback

    for (let r = headerRow + 1; r <= range.e.r; r++) {
      // ---- Expense side ----
      const expDate = ws[XLSX.utils.encode_cell({ r, c: 1 })];
      const expAmt  = ws[XLSX.utils.encode_cell({ r, c: 2 })];
      const expCat  = ws[XLSX.utils.encode_cell({ r, c: 3 })];
      const expSub  = ws[XLSX.utils.encode_cell({ r, c: 4 })];
      const expCmt  = ws[XLSX.utils.encode_cell({ r, c: 5 })];
      const expAcc  = ws[XLSX.utils.encode_cell({ r, c: 6 })];

      if (expDate && expAmt && typeof expAmt.v === 'number' && expAmt.v > 0) {
        const accName = expAcc && expAcc.v ? String(expAcc.v).trim() : null;
        const acc = accName ? imported.accounts.find(a => a.name === accName) : null;
        if (acc) {
          // Parse date
          let d;
          if (expDate.t === 'd' && expDate.v instanceof Date) d = expDate.v;
          else if (typeof expDate.v === 'number') {
            d = new Date(Math.round((expDate.v - 25569) * 86400 * 1000));
          } else {
            d = new Date(expDate.w || expDate.v);
          }
          if (!isNaN(d.getTime())) {
            // If category is "Account adjustment", this isn't really an expense —
            // it's a transfer/refund logged on the expense side. Money LEFT the
            // account, so store as adjustment with NEGATIVE amount.
            const catVal = expCat && expCat.v ? String(expCat.v) : '';
            const isAdjustment = catVal === 'Account adjustment';
            imported.transactions.push({
              id: uid(),
              date: dateStr(d),
              type: isAdjustment ? 'adjustment' : 'expense',
              amount: isAdjustment ? -expAmt.v : expAmt.v,
              currency: acc.currency,
              category: catVal,
              subcategory: expSub && expSub.v ? String(expSub.v) : '',
              account: acc.id,
              comment: expCmt && expCmt.v ? String(expCmt.v) : '',
            });
          }
        }
      }

      // ---- Income side ----
      const incAmt = ws[XLSX.utils.encode_cell({ r, c: 8 })];
      const incTyp = ws[XLSX.utils.encode_cell({ r, c: 9 })];
      const incCmt = ws[XLSX.utils.encode_cell({ r, c: 10 })];
      const incAcc = ws[XLSX.utils.encode_cell({ r, c: 11 })];

      if (incAmt && typeof incAmt.v === 'number' && incTyp && incTyp.v) {
        const accName = incAcc && incAcc.v ? String(incAcc.v).trim() : null;
        const acc = accName ? imported.accounts.find(a => a.name === accName) : null;
        if (acc) {
          const typeStr = String(incTyp.v);
          const d = new Date(currentImportYear, monthIdx, 28);
          const type = typeStr === 'Account adjustment' ? 'adjustment' : 'income';
          imported.transactions.push({
            id: uid(),
            date: dateStr(d),
            type,
            amount: incAmt.v,
            currency: acc.currency,
            category: typeStr,
            subcategory: '',
            account: acc.id,
            comment: incCmt && incCmt.v ? String(incCmt.v) : '',
          });
        }
      }
    }
  });

  return imported;
}

let currentImportYear = 2026;

async function importXlsx(file) {
  const buf = await file.arrayBuffer();
  // Try to detect year from filename like "Budget_2026.xlsx"
  const match = (file.name || '').match(/(\d{4})/);
  currentImportYear = match ? parseInt(match[1]) : new Date().getFullYear();

  const imported = parseXlsx(buf);
  state.accounts = imported.accounts;
  state.categories = imported.categories;
  state.openingBalances = imported.openingBalances;
  state.transactions = imported.transactions;
  state.incomeTypes = imported.incomeTypes;
  state.hasData = true;

  await saveState();
  toast(`Imported ${imported.transactions.length} transactions across ${imported.accounts.length} accounts`);
  render();
}

function exportData() {
  const json = JSON.stringify({
    accounts: state.accounts,
    categories: state.categories,
    incomeTypes: state.incomeTypes,
    transactions: state.transactions,
    openingBalances: state.openingBalances,
    fxRate: state.fxRate,
    exportedAt: new Date().toISOString(),
  }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ledger-export-${dateStr(new Date())}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Exported to JSON');
}

// ============================================================
// VIEWS
// ============================================================
function render() {
  const main = document.getElementById('main');
  // Nav active state
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.activeView);
  });
  document.getElementById('fxRate').value = state.fxRate;

  if (!state.hasData) {
    renderEmpty();
    return;
  }

  switch (state.activeView) {
    case 'dashboard': renderDashboard(); break;
    case 'transactions': renderTransactions(); break;
    case 'accounts': renderAccounts(); break;
    case 'categories': renderCategories(); break;
    case 'forecast': renderForecast(); break;
  }
}

function renderEmpty() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="empty">
      <h2>Welcome to Ledger</h2>
      <p>Import your existing budget spreadsheet or start a fresh one.</p>
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📂</div>
        <div><strong>Drop your Budget .xlsx here</strong></div>
        <div class="fine" style="margin-top:6px">or click to browse</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
      </div>
      <div style="margin-top:20px">
        <button class="btn" id="btnStartFresh">Start empty</button>
      </div>
    </div>
  `;
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  dz.onclick = () => fi.click();
  fi.onchange = (e) => { if (e.target.files[0]) importXlsx(e.target.files[0]); };
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('dragover'); };
  dz.ondragleave = () => dz.classList.remove('dragover');
  dz.ondrop = (e) => {
    e.preventDefault(); dz.classList.remove('dragover');
    if (e.dataTransfer.files[0]) importXlsx(e.dataTransfer.files[0]);
  };
  document.getElementById('btnStartFresh').onclick = startFresh;
}

async function startFresh() {
  state.accounts = [{ id: uid(), name: 'Main', currency: 'EUR' }];
  state.categories = {
    'Food': ['Groceries', 'Restaurants', 'Takeout/Cafe'],
    'Home': ['Rent', 'Utilities'],
    'Transit': ['Taxi', 'Public'],
    'Misc': ['Other'],
  };
  state.openingBalances = { [state.accounts[0].id]: 0 };
  state.transactions = [];
  state.hasData = true;
  await saveState();
  render();
}

// ------------- DASHBOARD -------------
function renderDashboard() {
  const year = currentYear();
  const { expenses, income } = monthlyTotals(year);
  const totalBalance = totalBalanceNow();
  const currentMonth = Math.max(0, expenses.findIndex((e, i) => i < 11 && expenses[i+1] === 0 && e > 0));
  // Actually: current month = last month with data
  let lastMonth = -1;
  for (let i = 11; i >= 0; i--) if (expenses[i] > 0 || income[i] > 0) { lastMonth = i; break; }

  const thisMonthExp = lastMonth >= 0 ? expenses[lastMonth] : 0;
  const thisMonthInc = lastMonth >= 0 ? income[lastMonth] : 0;
  const net = thisMonthInc - thisMonthExp;
  const ytdExp = expenses.reduce((s, x) => s + x, 0);
  const ytdInc = income.reduce((s, x) => s + x, 0);

  const prevMonthExp = lastMonth > 0 ? expenses[lastMonth - 1] : 0;
  const expDelta = prevMonthExp ? ((thisMonthExp - prevMonthExp) / prevMonthExp * 100) : 0;

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="hero">
      <div class="hero-cell">
        <div class="hero-label">Total balance · across all accounts</div>

        <div class="hero-sub">${state.accounts.length} accounts · base: EUR</div>
      </div>
      <div class="hero-cell">
        <div class="hero-label">This month · ${lastMonth >= 0 ? MONTHS[lastMonth] : '—'}</div>
        <div class="hero-value serif ${net >= 0 ? 'flow-up' : 'flow-down'}">${net >= 0 ? '+' : ''}${fmtEUR(net)}</div>
        <div class="hero-delta ${expDelta < 0 ? 'pos' : expDelta > 0 ? 'neg' : ''}">
          ${expDelta === 0 ? '' : (expDelta > 0 ? '↑' : '↓') + ' ' + Math.abs(expDelta).toFixed(1) + '% spending vs. prev'}
        </div>
      </div>
      <div class="hero-cell">
        <div class="hero-label">Year-to-date · ${year}</div>
        <div class="hero-value serif">${fmtEUR(ytdInc - ytdExp)}</div>

      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Monthly flow <span class="card-title-sub">${year}</span></div>
        <div class="chart-wrap"><canvas id="chartFlow"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Balance trajectory <span class="card-title-sub">EUR, end of month</span></div>

      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Spending by category <span class="card-title-sub">YTD</span></div>

        <div id="recentTx"></div>
      </div>

  `;

  // Flow chart

      datasets: [
        { label: 'Income', data: income, backgroundColor: '#2d6a4f', borderRadius: 2 },
        { label: 'Expenses', data: expenses.map(e => -e), backgroundColor: '#c44536', borderRadius: 2 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Inter Tight', size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmtEUR(Math.abs(ctx.parsed.y)) } }
      },
      scales: {
        x: { stacked: false, grid: { display: false }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } },
        y: { grid: { color: '#f0ead9' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, callback: (v) => fmtEUR(v, {noSymbol: true}) } }
      }
    }
  });

  // Balance chart
  const balSeries = Array(12).fill(null).map((_, m) => totalBalanceAtMonth(m, year));
  const ctxBal = document.getElementById('chartBalance');

      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {

      },
      scales: {

  // Category list
  const cats = categoryTotals(year, null);
  const totalCat = Object.values(cats).reduce((s, v) => s + v, 0);
  const sorted = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const palette = ['#c44536', '#e09f3e', '#1d3557', '#2d6a4f', '#9c4a97', '#6a7f4a', '#a4161a', '#457b9d'];
  document.getElementById('catList').innerHTML = sorted.length === 0
    ? '<p class="fine">No expenses yet.</p>'
    : sorted.map(([cat, amt], i) => {
      const pct = totalCat ? (amt / totalCat * 100) : 0;
      return `
        <div class="cat-row">
          <div>${cat}</div>
          <div class="amt">${fmtEUR(amt)}</div>
          <div class="tag-n">${pct.toFixed(1)}%</div>
          <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;background:${palette[i % palette.length]}"></div></div>
        </div>
      `;
    }).join('');

  // Recent
  const recent = [...state.transactions]
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 8);
  document.getElementById('recentTx').innerHTML = recent.length === 0
    ? '<p class="fine">No transactions.</p>'
    : `<table><tbody>${recent.map(tx => txRow(tx, { compact: true })).join('')}</tbody></table>`;
}

function txRow(tx, opts = {}) {
  const acc = accountById(tx.account);
  const amtClass = tx.type === 'expense' ? 'amt-exp' : tx.type === 'income' ? 'amt-inc' : 'amt-adj';
  const sign = tx.type === 'expense' ? '−' : tx.type === 'income' ? '+' : (tx.amount >= 0 ? '+' : '−');
  const amtEUR = toEUR(Math.abs(tx.amount), tx.currency);
  const typePill = tx.type === 'expense' ? '' : `<span class="pill pill-${tx.type === 'income' ? 'income' : 'adjust'}">${tx.type}</span>`;
  if (opts.compact) {
    return `
      <tr class="tx-row" onclick="openEditTx('${tx.id}')">
        <td class="mono" style="color:var(--ink-mute); width: 70px">${dateDisplay(tx.date)}</td>
        <td>${tx.category}${tx.subcategory ? ' <span class="tag-n">· ' + tx.subcategory + '</span>' : ''}</td>
        <td style="text-align:right" class="amt ${amtClass}">${sign}${fmtEUR(amtEUR)}</td>
      </tr>
    `;
  }
  return `
    <tr class="tx-row" onclick="openEditTx('${tx.id}')">
      <td class="mono" style="color:var(--ink-mute)">${dateDisplay(tx.date)}</td>
      <td>${typePill}<span class="pill pill-cat">${tx.category}</span>${tx.subcategory ? '<span class="pill pill-sub">' + tx.subcategory + '</span>' : ''}</td>
      <td>${tx.comment || '<span class="fine">—</span>'}</td>
      <td><span class="pill pill-acc">${acc ? acc.name : '?'}</span></td>
      <td style="text-align:right" class="amt ${amtClass}">${sign}${fmtNum(Math.abs(tx.amount))} ${tx.currency === 'USD' ? '$' : '€'}</td>
      <td style="text-align:right; color:var(--ink-mute); font-size:11px" class="mono">${fmtEUR(amtEUR)}</td>
    </tr>
  `;
}

// ------------- TRANSACTIONS -------------

    if (f.category !== 'all' && tx.category !== f.category) return false;
    if (f.account !== 'all' && tx.account !== f.account) return false;
    if (f.type !== 'all' && tx.type !== f.type) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!(tx.comment || '').toLowerCase().includes(q) &&
          !(tx.category || '').toLowerCase().includes(q) &&
          !(tx.subcategory || '').toLowerCase().includes(q)) return false;

    return true;

  const totalExp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + toEUR(t.amount, t.currency), 0);

        <div class="stat-label">Income</div>

      </div>
      <div class="filter-group">
        <label>Month</label>
        <select id="fMonth">
          <option value="all">All months</option>
          ${MONTHS.map((m, i) => `<option value="${i}" ${f.month == i ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Category</label>
        <select id="fCat">
          <option value="all">All</option>
          ${cats.map(c => `<option value="${c}" ${f.category === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Account</label>
        <select id="fAcc">
          <option value="all">All</option>
          ${state.accounts.map(a => `<option value="${a.id}" ${f.account === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Type</label>
        <select id="fType">
          <option value="all">All</option>
          <option value="expense" ${f.type === 'expense' ? 'selected' : ''}>Expense</option>
          <option value="income" ${f.type === 'income' ? 'selected' : ''}>Income</option>
          <option value="adjustment" ${f.type === 'adjustment' ? 'selected' : ''}>Adjustment</option>

    <div class="card" style="padding:0">
      <div class="tx-table-wrap">

    f.search = document.getElementById('fSearch').value;
    renderTransactions();
  });

// Format an amount with the correct currency symbol
function fmtAmt(n, currency) {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  const parts = abs.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const sym = currency === 'USD' ? '$' : '€';
  return `${sign}${sym}${parts.join('.')}`;
}

function escapeAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

async function addCategory() {
  const name = prompt('New category name:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.categories[trimmed]) { toast('Category already exists'); return; }
  state.categories[trimmed] = [];
  await saveState();
  render();
  toast('Added');
}

async function renameCategory(oldName) {
  const name = prompt('Rename category:', oldName);
  if (!name || !name.trim() || name === oldName) return;
  const trimmed = name.trim();
  if (state.categories[trimmed]) { toast('Name already in use'); return; }
  state.categories[trimmed] = state.categories[oldName];
  delete state.categories[oldName];
  // Update transactions
  state.transactions.forEach(tx => { if (tx.category === oldName) tx.category = trimmed; });
  await saveState();
  render();
  toast('Renamed');
}

async function deleteCategory(name) {
  const txCount = state.transactions.filter(tx => tx.category === name).length;
  const msg = txCount > 0
    ? `Delete "${name}"? ${txCount} transaction${txCount > 1 ? 's' : ''} use this category and will be moved to "Misc".`
    : `Delete "${name}"?`;
  if (!confirm(msg)) return;
  if (txCount > 0) {
    if (!state.categories['Misc']) state.categories['Misc'] = [];
    state.transactions.forEach(tx => {
      if (tx.category === name) { tx.category = 'Misc'; tx.subcategory = ''; }
    });
  }
  delete state.categories[name];
  await saveState();
  render();
  toast('Deleted');
}

async function addSub(cat) {
  const name = prompt(`New sub-category under "${cat}":`);
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.categories[cat].includes(trimmed)) { toast('Already exists'); return; }
  state.categories[cat].push(trimmed);
  await saveState();
  render();
  toast('Added');
}

async function renameSub(cat, oldName) {
  const name = prompt('Rename sub-category:', oldName);
  if (!name || !name.trim() || name === oldName) return;
  const trimmed = name.trim();
  if (state.categories[cat].includes(trimmed)) { toast('Name already in use'); return; }
  const i = state.categories[cat].indexOf(oldName);
  if (i < 0) return;
  state.categories[cat][i] = trimmed;
  state.transactions.forEach(tx => {
    if (tx.category === cat && tx.subcategory === oldName) tx.subcategory = trimmed;
  });
  await saveState();
  render();
  toast('Renamed');
}

async function deleteSub(cat, name) {
  const txCount = state.transactions.filter(tx => tx.category === cat && tx.subcategory === name).length;
  const msg = txCount > 0
    ? `Delete sub-category "${name}"? ${txCount} transaction${txCount > 1 ? 's' : ''} will have their sub-category cleared.`
    : `Delete sub-category "${name}"?`;
  if (!confirm(msg)) return;
  state.categories[cat] = state.categories[cat].filter(s => s !== name);
  state.transactions.forEach(tx => {
    if (tx.category === cat && tx.subcategory === name) tx.subcategory = '';
  });
  await saveState();
  render();
  toast('Deleted');
}

async function renameIncomeType(oldName) {
  const name = prompt('Rename income category:', oldName);
  if (!name || !name.trim() || name === oldName) return;
  const trimmed = name.trim();
  if (state.incomeTypes.includes(trimmed)) { toast('Name already in use'); return; }
  const i = state.incomeTypes.indexOf(oldName);
  if (i < 0) return;
  state.incomeTypes[i] = trimmed;
  state.transactions.forEach(tx => {
    if (tx.type === 'income' && tx.category === oldName) tx.category = trimmed;
  });
  await saveState();
  render();
  toast('Renamed');
}

async function deleteIncomeType(name) {
  const txCount = state.transactions.filter(tx => tx.type === 'income' && tx.category === name).length;
  if (txCount > 0) {
    toast(`Cannot delete: ${txCount} income transaction${txCount > 1 ? 's' : ''} use this category. Rename them first.`);
    return;
  }
  if (!confirm(`Delete income category "${name}"?`)) return;
  state.incomeTypes = state.incomeTypes.filter(t => t !== name);
  await saveState();
  render();
  toast('Deleted');
}

// ------------- FORECAST -------------
function renderForecast() {
  const year = currentYear();
  const { expenses, income } = monthlyTotals(year);
  const forecast = forecastSpend(year);
  const main = document.getElementById('main');

  if (forecast.lastActual < 0) {
    main.innerHTML = `<div class="card"><div class="card-title">Forecast</div><p>Need at least one month of spending data to forecast.</p></div>`;
    return;
  }

  // Projected balance trajectory
  const avgIncome = income.slice(0, forecast.lastActual + 1).reduce((s, x) => s + x, 0) / forecast.monthsCount;
  const avgExp = forecast.totalAvgMonthly;
  const projBalance = [];
  let running = totalBalanceAtMonth(forecast.lastActual, year);
  for (let m = 0; m < 12; m++) {
    if (m <= forecast.lastActual) {
      projBalance.push(totalBalanceAtMonth(m, year));
    } else {
      running += (avgIncome - avgExp);
      projBalance.push(running);
    }
  }
  const eoyBalance = projBalance[11];
  const savings = eoyBalance - totalBalanceAtMonth(-1, year);

  const sortedCats = Object.entries(forecast.perCategory).sort((a, b) => b[1].avgMonthly - a[1].avgMonthly);
  const totalAvg = sortedCats.reduce((s, [, v]) => s + v.avgMonthly, 0);

  main.innerHTML = `
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-label">Based on</div>
        <div class="stat-value">${forecast.monthsCount} month${forecast.monthsCount > 1 ? 's' : ''}</div>
        <div class="fine">Jan – ${MONTHS[forecast.lastActual]}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg monthly spend</div>
        <div class="stat-value" style="color:var(--red)">${fmtEUR(avgExp)}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg monthly income</div>
        <div class="stat-value" style="color:var(--green)">${fmtEUR(avgIncome)}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Projected EOY balance</div>
        <div class="stat-value serif">${fmtEUR(eoyBalance)}</div>
        <div class="fine">${savings >= 0 ? '+' : ''}${fmtEUR(savings)} this year</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Projected balance <span class="card-title-sub">actuals + forecast</span></div>
      <div class="chart-wrap-lg"><canvas id="chartProj"></canvas></div>
    </div>

    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">Category burn rate <span class="card-title-sub">€ / month average</span></div>
        ${sortedCats.map(([c, v]) => {
          const pct = totalAvg ? (v.avgMonthly / totalAvg * 100) : 0;
          const remaining = (11 - forecast.lastActual) * v.avgMonthly;
          return `<div class="cat-row">
            <div>${c}<div class="fine">€${fmtNum(remaining)} expected thru year-end</div></div>
            <div class="amt">${fmtEUR(v.avgMonthly)}</div>
            <div class="tag-n">${pct.toFixed(0)}%</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-title">Year outlook <span class="card-title-sub">projected spend</span></div>
        <div class="chart-wrap"><canvas id="chartYearProj"></canvas></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">Forecast notes</div>
      <p>The forecast assumes you'll continue spending at your current <strong>average monthly rate of ${fmtEUR(avgExp)}</strong> across ${sortedCats.length} categories. Income is projected at <strong>${fmtEUR(avgIncome)}/month</strong>, giving a net savings rate of <strong>${fmtEUR(avgIncome - avgExp)}/month</strong>.</p>
      <p style="margin-top:10px" class="fine">Projections update automatically as you add more transactions. Based on ${forecast.monthsCount} completed month${forecast.monthsCount > 1 ? 's' : ''}.</p>
    </div>
  `;

  // Projected balance chart
  new Chart(document.getElementById('chartProj'), {
    type: 'line',
    data: {
      labels: MONTHS_SHORT,
      datasets: [
        {
          label: 'Actual',
          data: projBalance.map((v, i) => i <= forecast.lastActual ? v : null),
          borderColor: '#1d3557', backgroundColor: 'rgba(29,53,87,0.08)',
          fill: true, tension: 0.3, borderWidth: 2.5, pointRadius: 3
        },
        {
          label: 'Projected',
          data: projBalance.map((v, i) => i >= forecast.lastActual ? v : null),
          borderColor: '#e09f3e', backgroundColor: 'rgba(224,159,62,0.08)',
          fill: true, tension: 0.3, borderWidth: 2.5, pointRadius: 3, borderDash: [6, 4]
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Inter Tight', size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmtEUR(ctx.parsed.y) } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } },
        y: { grid: { color: '#f0ead9' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, callback: (v) => fmtEUR(v, {noSymbol: true}) } }
      }
    }
  });

  // Year overview - actual vs projected bars
  new Chart(document.getElementById('chartYearProj'), {
    type: 'bar',
    data: {
      labels: MONTHS_SHORT,
      datasets: [
        {
          label: 'Actual',
          data: expenses.map((v, i) => i <= forecast.lastActual ? v : null),
          backgroundColor: '#c44536', borderRadius: 2
        },
        {
          label: 'Projected',
          data: forecast.perMonth.map((v, i) => i > forecast.lastActual ? v : null),
          backgroundColor: 'rgba(224,159,62,0.7)', borderRadius: 2
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Inter Tight', size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmtEUR(ctx.parsed.y) } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } },
        y: { grid: { color: '#f0ead9' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, callback: (v) => fmtEUR(v, {noSymbol: true}) } }
      }
    }
  });
}

let pendingTxType = 'expense';
function setTxType(type) {
  pendingTxType = type;
  // Redraw fields
  const editBtns = document.querySelectorAll('.modal .segment button');
  editBtns.forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === type));

  const catSel = document.getElementById('txCategory');
  if (type === 'expense') {
    catSel.innerHTML = Object.keys(state.categories).map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('subField').style.display = '';
    // Refresh subs
    const subs = state.categories[catSel.value] || [];
    document.getElementById('txSub').innerHTML = '<option value="">—</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
  } else {
    catSel.innerHTML = state.incomeTypes.map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('subField').style.display = 'none';
  }
}
function getCurrentTxType() { return pendingTxType; }

async function saveTx(editId) {
  const type = pendingTxType;
  const tx = {
    id: editId || uid(),
    date: document.getElementById('txDate').value,
    type,
    amount: parseFloat(document.getElementById('txAmount').value) || 0,
    currency: document.getElementById('txCurrency').value,
    category: document.getElementById('txCategory').value,
    subcategory: type === 'expense' ? document.getElementById('txSub').value : '',
    account: document.getElementById('txAccount').value,
    comment: document.getElementById('txComment').value,
  };
  if (!tx.amount || !tx.date) { toast('Date and amount required'); return; }
  if (editId) {
    state.transactions = state.transactions.map(t => t.id === editId ? tx : t);
  } else {
    state.transactions.push(tx);
  }
  await saveState();
  closeModal();
  render();
  toast(editId ? 'Transaction updated' : 'Transaction added');
}

async function deleteTx(id) {
  if (!confirm('Delete this transaction?')) return;
  state.transactions = state.transactions.filter(t => t.id !== id);
  await saveState();
  closeModal();
  render();
  toast('Deleted');
}

function openEditTx(id) {
  const tx = state.transactions.find(t => t.id === id);
  if (!tx) return;
  pendingTxType = tx.type;
  openAddTx(tx);
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

document.getElementById('btnFetchFx').addEventListener('click', async () => {
  const btn = document.getElementById('btnFetchFx');
  const original = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    // Use a public CORS-friendly FX API (Frankfurter, maintained by ECB data)
    const res = await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=EUR');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rate = data && data.rates && data.rates.EUR;
    if (!rate || !isFinite(rate)) throw new Error('Invalid rate');
    state.fxRate = Math.round(rate * 10000) / 10000;
    document.getElementById('fxRate').value = state.fxRate;
    await saveState();
    render();
    toast(`Updated: 1 USD = €${state.fxRate.toFixed(4)}`);
  } catch (err) {
    toast('Could not fetch live rate — ' + err.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
});

const sb = supabase.createClient(
  window.LEDGER_CONFIG.SUPABASE_URL,
  window.LEDGER_CONFIG.SUPABASE_KEY,
  { auth: { persistSession: true, autoRefreshToken: true } }
);

let currentUser = null;

async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  return currentUser;
}

function renderAuthScreen(mode = 'login') {
  const isSignup = mode === 'signup';
  document.body.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark" style="width:36px;height:36px;font-size:14px">€</span>
          Ledger
        </div>
        <div class="auth-tag">Personal budget, shared or solo.</div>
        <form class="auth-form" onsubmit="return false">
          <label>Email</label>
          <input type="email" id="authEmail" autocomplete="email" required>
          <label>Password</label>
          <input type="password" id="authPassword" autocomplete="${isSignup ? 'new-password' : 'current-password'}" required minlength="6">
          <button class="btn btn-primary auth-submit" id="authSubmit">
            ${isSignup ? 'Create account' : 'Sign in'}
          </button>
          <div id="authMsg"></div>
        </form>
        <div class="auth-switch">
          ${isSignup
            ? `Already have an account? <a onclick="renderAuthScreen('login')">Sign in</a>`
            : `New here? <a onclick="renderAuthScreen('signup')">Create an account</a>`}
        </div>
        ${!isSignup ? `<div class="auth-switch" style="margin-top:8px"><a onclick="sendPasswordReset()">Forgot password?</a></div>` : ''}
      </div>
    </div>
  `;

  const submitBtn = document.getElementById('authSubmit');
  submitBtn.onclick = async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const msgEl = document.getElementById('authMsg');
    msgEl.innerHTML = '';
    if (!email || !password) { msgEl.innerHTML = '<div class="auth-error">Email and password required</div>'; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = '…';

    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          // Email confirmation is required
          msgEl.innerHTML = '<div class="auth-notice">Check your inbox to confirm your email, then sign in.</div>';
          submitBtn.textContent = 'Create account';
          submitBtn.disabled = false;
          return;
        }
        // Logged in immediately (confirm email off)
        currentUser = data.user;
        await bootMainApp();
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        await bootMainApp();
      }
    } catch (err) {
      msgEl.innerHTML = `<div class="auth-error">${err.message || 'Something went wrong'}</div>`;
      submitBtn.textContent = isSignup ? 'Create account' : 'Sign in';
      submitBtn.disabled = false;
    }
  };

  // Enter submits
  ['authEmail', 'authPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') submitBtn.click();
    });
  });
}

async function sendPasswordReset() {
  const email = (document.getElementById('authEmail') || {}).value;
  if (!email) { toast('Enter your email first'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  const msgEl = document.getElementById('authMsg');
  if (error) {
    msgEl.innerHTML = `<div class="auth-error">${error.message}</div>`;
  } else {
    msgEl.innerHTML = `<div class="auth-notice">Reset link sent to ${email}</div>`;
  }
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null;
  location.reload();
}

// ---- Budget bootstrap ----
// Returns an existing budget the user is a member of, or creates a default one.
async function ensureBudget() {
  // Try to find a budget I'm a member of
  const { data: memberships, error: mErr } = await sb
    .from('budget_members')
    .select('budget_id, role, budgets(id, name, fx_rate, base_currency, owner_id)')
    .eq('user_id', currentUser.id)
    .limit(1);

  if (mErr) throw mErr;
  if (memberships && memberships.length > 0) {
    const b = memberships[0].budgets;
    return { id: b.id, name: b.name, fxRate: parseFloat(b.fx_rate), baseCurrency: b.base_currency, ownerId: b.owner_id };
  }

  // None exist → create default budget for this user
  const { data: newBudget, error: bErr } = await sb
    .from('budgets')
    .insert({ name: 'My Budget', owner_id: currentUser.id, fx_rate: 0.854, base_currency: 'EUR' })
    .select()
    .single();
  if (bErr) throw bErr;
  return { id: newBudget.id, name: newBudget.name, fxRate: parseFloat(newBudget.fx_rate), baseCurrency: newBudget.base_currency, ownerId: newBudget.owner_id };
}

// ---- Load all data for a budget into state ----
async function loadBudgetData(budgetId) {
  // Accounts
  const { data: accounts, error: aErr } = await sb
    .from('accounts')
    .select('*')
    .eq('budget_id', budgetId)
    .order('sort_order', { ascending: true });
  if (aErr) throw aErr;

  state.accounts = (accounts || []).map(a => ({
    id: a.id,
    name: a.name,
    currency: a.currency,
  }));
  state.openingBalances = {};
  (accounts || []).forEach(a => { state.openingBalances[a.id] = parseFloat(a.opening_balance) || 0; });

  // Categories (expense + income)
  const { data: cats, error: cErr } = await sb
    .from('categories')
    .select('*, subcategories(*)')
    .eq('budget_id', budgetId)
    .order('sort_order', { ascending: true });
  if (cErr) throw cErr;

  state.categories = {};
  state.incomeTypes = [];
  (cats || []).forEach(c => {
    if (c.kind === 'expense') {
      state.categories[c.name] = (c.subcategories || [])
        .sort((a, b) => a.sort_order - b.sort_order)
        .map(s => s.name);
    } else {
      state.incomeTypes.push(c.name);
    }
  });
  if (state.incomeTypes.length === 0) {
    state.incomeTypes = ['Salary', 'Reimbursement', 'Account adjustment'];
  }

  // Transactions
  const { data: txs, error: tErr } = await sb
    .from('transactions')
    .select('*')
    .eq('budget_id', budgetId)
    .order('date', { ascending: false });
  if (tErr) throw tErr;

  state.transactions = (txs || []).map(t => ({
    id: t.id,
    date: t.date,
    type: t.type,
    amount: parseFloat(t.amount),
    currency: t.currency,
    category: t.category || '',
    subcategory: t.subcategory || '',
    account: t.account_id,
    comment: t.comment || '',
  }));

  state.hasData = state.accounts.length > 0 || state.transactions.length > 0;
}

// ---- Budget-level updates ----
async function cloudUpdateBudget(patch) {
  if (!state.budgetId) return;
  const dbPatch = {};
  if ('fxRate' in patch) dbPatch.fx_rate = patch.fxRate;
  if ('baseCurrency' in patch) dbPatch.base_currency = patch.baseCurrency;
  if ('name' in patch) dbPatch.name = patch.name;
  const { error } = await sb.from('budgets').update(dbPatch).eq('id', state.budgetId);
  if (error) throw error;
}

// ---- Accounts ----
async function cloudCreateAccount({ name, currency, opening_balance = 0, sort_order = 0 }) {
  const { data, error } = await sb
    .from('accounts')
    .insert({ budget_id: state.budgetId, name, currency, opening_balance, sort_order })
    .select()
    .single();
  if (error) throw error;
  return { id: data.id, name: data.name, currency: data.currency, opening: parseFloat(data.opening_balance) };
}

async function cloudUpdateAccount(id, patch) {
  const { error } = await sb.from('accounts').update(patch).eq('id', id);
  if (error) throw error;
}

async function cloudDeleteAccount(id) {
  const { error } = await sb.from('accounts').delete().eq('id', id);
  if (error) throw error;
}

// ---- Categories ----
async function cloudCreateCategory(name, kind = 'expense') {
  const { data, error } = await sb
    .from('categories')
    .insert({ budget_id: state.budgetId, name, kind })
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function cloudRenameCategory(oldName, newName, kind = 'expense') {
  const { data: cat, error: e1 } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', oldName)
    .eq('kind', kind)
    .single();
  if (e1) throw e1;
  const { error: e2 } = await sb.from('categories').update({ name: newName }).eq('id', cat.id);
  if (e2) throw e2;
  // Also update txs (category is stored as text, not FK)
  const { error: e3 } = await sb
    .from('transactions')
    .update({ category: newName })
    .eq('budget_id', state.budgetId)
    .eq('category', oldName);
  if (e3) throw e3;
}

async function cloudDeleteCategory(name, kind = 'expense') {
  const { error } = await sb
    .from('categories')
    .delete()
    .eq('budget_id', state.budgetId)
    .eq('name', name)
    .eq('kind', kind);
  if (error) throw error;
}

async function cloudReassignCategory(oldName, newName) {
  const { error } = await sb
    .from('transactions')
    .update({ category: newName, subcategory: '' })
    .eq('budget_id', state.budgetId)
    .eq('category', oldName);
  if (error) throw error;
}

// ---- Subcategories ----
async function cloudCreateSub(categoryName, subName) {
  const { data: cat, error: e1 } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', categoryName)
    .eq('kind', 'expense')
    .single();
  if (e1) throw e1;
  const { error: e2 } = await sb
    .from('subcategories')
    .insert({ category_id: cat.id, name: subName });
  if (e2) throw e2;
}

async function cloudRenameSub(categoryName, oldSub, newSub) {
  const { data: cat } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', categoryName)
    .eq('kind', 'expense')
    .single();
  if (!cat) return;
  const { error: e1 } = await sb
    .from('subcategories')
    .update({ name: newSub })
    .eq('category_id', cat.id)
    .eq('name', oldSub);
  if (e1) throw e1;
  const { error: e2 } = await sb
    .from('transactions')
    .update({ subcategory: newSub })
    .eq('budget_id', state.budgetId)
    .eq('category', categoryName)
    .eq('subcategory', oldSub);
  if (e2) throw e2;
}

async function cloudDeleteSub(categoryName, subName) {
  const { data: cat } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', categoryName)
    .eq('kind', 'expense')
    .single();
  if (!cat) return;
  const { error: e1 } = await sb
    .from('subcategories')
    .delete()
    .eq('category_id', cat.id)
    .eq('name', subName);
  if (e1) throw e1;
  // Clear subcategory on any transactions using it
  const { error: e2 } = await sb
    .from('transactions')
    .update({ subcategory: '' })
    .eq('budget_id', state.budgetId)
    .eq('category', categoryName)
    .eq('subcategory', subName);
  if (e2) throw e2;
}

// ---- Transactions ----
function txToDb(tx) {
  return {
    budget_id: state.budgetId,
    date: tx.date,
    type: tx.type,
    amount: tx.amount,
    currency: tx.currency,
    category: tx.category || null,
    subcategory: tx.subcategory || null,
    account_id: tx.account || null,
    comment: tx.comment || null,
    created_by: currentUser ? currentUser.id : null,
  };
}

async function cloudCreateTx(tx) {
  const { data, error } = await sb
    .from('transactions')
    .insert(txToDb(tx))
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function cloudUpdateTx(id, tx) {
  const patch = txToDb(tx);
  delete patch.budget_id;
  delete patch.created_by;
  patch.updated_at = new Date().toISOString();
  const { error } = await sb.from('transactions').update(patch).eq('id', id);
  if (error) throw error;
}

async function cloudDeleteTx(id) {
  const { error } = await sb.from('transactions').delete().eq('id', id);
  if (error) throw error;
}

// ---- Bulk import from xlsx ----
// Called after parseXlsx returns `imported`. Writes everything to the cloud.
async function cloudBulkImport(imported) {
  // 1. Accounts — preserve old IDs → new IDs mapping for transaction account refs
  const accMap = {};
  for (let i = 0; i < imported.accounts.length; i++) {
    const a = imported.accounts[i];
    const opening = imported.openingBalances[a.id] || 0;
    const { data, error } = await sb
      .from('accounts')
      .insert({
        budget_id: state.budgetId,
        name: a.name,
        currency: a.currency,
        opening_balance: opening,
        sort_order: i,
      })
      .select()
      .single();
    if (error) throw error;
    accMap[a.id] = data.id;
  }

  // 2. Categories + subcategories
  let catSortOrder = 0;
  for (const [catName, subs] of Object.entries(imported.categories)) {
    const { data: cat, error: e1 } = await sb
      .from('categories')
      .insert({ budget_id: state.budgetId, name: catName, kind: 'expense', sort_order: catSortOrder++ })
      .select()
      .single();
    if (e1) throw e1;
    if (subs && subs.length > 0) {
      const subRows = subs.map((s, i) => ({ category_id: cat.id, name: s, sort_order: i }));
      const { error: e2 } = await sb.from('subcategories').insert(subRows);
      if (e2) throw e2;
    }
  }

  // 3. Income types (as categories with kind='income')
  let incSortOrder = 0;
  for (const name of imported.incomeTypes) {
    const { error } = await sb
      .from('categories')
      .insert({ budget_id: state.budgetId, name, kind: 'income', sort_order: incSortOrder++ });
    if (error && !String(error.message).includes('duplicate')) throw error;
  }

  // 4. Transactions — batch insert in chunks of 200
  const txRows = imported.transactions.map(t => ({
    budget_id: state.budgetId,
    date: t.date,
    type: t.type,
    amount: t.amount,
    currency: t.currency,
    category: t.category || null,
    subcategory: t.subcategory || null,
    account_id: accMap[t.account] || null,
    comment: t.comment || null,
    created_by: currentUser ? currentUser.id : null,
  }));

  const CHUNK = 200;
  for (let i = 0; i < txRows.length; i += CHUNK) {
    const batch = txRows.slice(i, i + CHUNK);
    const { error } = await sb.from('transactions').insert(batch);
    if (error) throw error;
  }
}

// ---- Delete all data in the current budget (for reset) ----
async function cloudWipeBudget() {
  if (!state.budgetId) return;
  // Cascades handle subcategories, transactions via FK on delete cascade if set.
  // But our schema doesn't cascade categories → subcategories (they do),
  // and doesn't cascade accounts → transactions. So delete in order:
  await sb.from('transactions').delete().eq('budget_id', state.budgetId);
  await sb.from('accounts').delete().eq('budget_id', state.budgetId);
  await sb.from('categories').delete().eq('budget_id', state.budgetId);
}

// ============================================================
// INIT (auth-gated)
// ============================================================
async function bootMainApp() {
  // Restore the main app HTML that was there originally
  location.reload(); // simplest: reload to get initial HTML, and init() will now pass auth
}

async function init() {
  const user = await checkAuth();
  if (!user) {
    renderAuthScreen('login');
    return;
  }

  // Add user menu to the topbar
  const topbarActions = document.querySelector('.topbar-actions');
  if (topbarActions && !document.getElementById('userPill')) {
    const pill = document.createElement('span');
    pill.className = 'user-pill';
    pill.id = 'userPill';
    pill.innerHTML = `<strong>${user.email}</strong> <a onclick="signOut()" style="cursor:pointer; color:var(--accent); margin-left:4px">Sign out</a>`;
    topbarActions.insertBefore(pill, topbarActions.firstChild);
  }

  await loadState();
  render();
}

// Auth state change listener (handles signin/signout in other tabs too)
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentUser = null;
    renderAuthScreen('login');
  }
});

init();

</script>
