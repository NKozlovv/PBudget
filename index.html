      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark" style="width:36px;height:36px;font-size:14px">€</span>
          Ledger
        </div>
        <div class="auth-tag">Personal budget, shared or solo.</div>
        <form class="auth-form" onsubmit="return false">
          <label>Email</label>
          <input type="email" id="authEmail" autocomplete="email" required>
          <label>Password</label>
          <input type="password" id="authPassword" autocomplete="${isSignup ? 'new-password' : 'current-password'}" required minlength="6">
          <button class="btn btn-primary auth-submit" id="authSubmit">
            ${isSignup ? 'Create account' : 'Sign in'}
          </button>
          <div id="authMsg"></div>
        </form>
        <div class="auth-switch">
          ${isSignup
            ? `Already have an account? <a onclick="renderAuthScreen('login')">Sign in</a>`
            : `New here? <a onclick="renderAuthScreen('signup')">Create an account</a>`}
        </div>
        ${!isSignup ? `<div class="auth-switch" style="margin-top:8px"><a onclick="sendPasswordReset()">Forgot password?</a></div>` : ''}
      </div>
    </div>
  `;

  const submitBtn = document.getElementById('authSubmit');
  submitBtn.onclick = async () => {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const msgEl = document.getElementById('authMsg');
    msgEl.innerHTML = '';
    if (!email || !password) { msgEl.innerHTML = '<div class="auth-error">Email and password required</div>'; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = '…';

    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          // Email confirmation is required
          msgEl.innerHTML = '<div class="auth-notice">Check your inbox to confirm your email, then sign in.</div>';
          submitBtn.textContent = 'Create account';
          submitBtn.disabled = false;
          return;
        }
        // Logged in immediately (confirm email off)
        currentUser = data.user;
        await bootMainApp();
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        await bootMainApp();
      }
    } catch (err) {
      msgEl.innerHTML = `<div class="auth-error">${err.message || 'Something went wrong'}</div>`;
      submitBtn.textContent = isSignup ? 'Create account' : 'Sign in';
      submitBtn.disabled = false;
    }
  };

  // Enter submits
  ['authEmail', 'authPassword'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') submitBtn.click();
    });
  });
}

async function sendPasswordReset() {
  const email = (document.getElementById('authEmail') || {}).value;
  if (!email) { toast('Enter your email first'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  const msgEl = document.getElementById('authMsg');
  if (error) {
    msgEl.innerHTML = `<div class="auth-error">${error.message}</div>`;
  } else {
    msgEl.innerHTML = `<div class="auth-notice">Reset link sent to ${email}</div>`;
  }
}

async function signOut() {
  await sb.auth.signOut();
  currentUser = null;
  location.reload();
}

// ============================================================
// SUPABASE DATA LAYER
// All cloud reads/writes for the active budget.
// `state.budgetId` must be set before any of these are called.
// ============================================================

// ---- Budget bootstrap ----
// Returns an existing budget the user is a member of, or creates a default one.
async function ensureBudget() {
  console.log('[ensureBudget] currentUser.id =', currentUser && currentUser.id);
  // Try to find a budget I'm a member of
  const { data: memberships, error: mErr } = await sb
    .from('budget_members')
    .select('budget_id, role, budgets(id, name, fx_rate, base_currency, owner_id)')
    .eq('user_id', currentUser.id)
    .limit(1);

  if (mErr) { console.error('[ensureBudget] membership lookup error:', mErr); throw mErr; }
  console.log('[ensureBudget] memberships:', memberships);
  if (memberships && memberships.length > 0) {
    const b = memberships[0].budgets;
    return { id: b.id, name: b.name, fxRate: parseFloat(b.fx_rate), baseCurrency: b.base_currency, ownerId: b.owner_id };
  }

  // None exist → create default budget for this user
  console.log('[ensureBudget] No budget found, creating with owner_id:', currentUser.id);
  const { data: newBudget, error: bErr } = await sb
    .from('budgets')
    .insert({ name: 'My Budget', owner_id: currentUser.id, fx_rate: 0.854, base_currency: 'EUR' })
    .select()
    .single();
  if (bErr) { console.error('[ensureBudget] budget insert error:', bErr); throw bErr; }
  console.log('[ensureBudget] created budget:', newBudget);
  return { id: newBudget.id, name: newBudget.name, fxRate: parseFloat(newBudget.fx_rate), baseCurrency: newBudget.base_currency, ownerId: newBudget.owner_id };
}

// ---- Load all data for a budget into state ----
async function loadBudgetData(budgetId) {
  // Accounts
  const { data: accounts, error: aErr } = await sb
    .from('accounts')
    .select('*')
    .eq('budget_id', budgetId)
    .order('sort_order', { ascending: true });
  if (aErr) throw aErr;

  state.accounts = (accounts || []).map(a => ({
    id: a.id,
    name: a.name,
    currency: a.currency,
  }));
  state.openingBalances = {};
  (accounts || []).forEach(a => { state.openingBalances[a.id] = parseFloat(a.opening_balance) || 0; });

  // Categories (expense + income)
  const { data: cats, error: cErr } = await sb
    .from('categories')
    .select('*, subcategories(*)')
    .eq('budget_id', budgetId)
    .order('sort_order', { ascending: true });
  if (cErr) throw cErr;

  state.categories = {};
  state.incomeTypes = [];
  (cats || []).forEach(c => {
    if (c.kind === 'expense') {
      state.categories[c.name] = (c.subcategories || [])
        .sort((a, b) => a.sort_order - b.sort_order)
        .map(s => s.name);
    } else {
      state.incomeTypes.push(c.name);
    }
  });
  if (state.incomeTypes.length === 0) {
    state.incomeTypes = ['Salary', 'Reimbursement', 'Account adjustment'];
  }

  // Transactions
  const { data: txs, error: tErr } = await sb
    .from('transactions')
    .select('*')
    .eq('budget_id', budgetId)
    .order('date', { ascending: false });
  if (tErr) throw tErr;

  state.transactions = (txs || []).map(t => ({
    id: t.id,
    date: t.date,
    type: t.type,
    amount: parseFloat(t.amount),
    currency: t.currency,
    fx_rate: t.fx_rate != null ? parseFloat(t.fx_rate) : null,
    category: t.category || '',
    subcategory: t.subcategory || '',
    account: t.account_id,
    comment: t.comment || '',
  }));

  state.hasData = state.accounts.length > 0 || state.transactions.length > 0;
}

// ---- Budget-level updates ----
async function cloudUpdateBudget(patch) {
  if (!state.budgetId) return;
  const dbPatch = {};
  if ('fxRate' in patch) dbPatch.fx_rate = patch.fxRate;
  if ('baseCurrency' in patch) dbPatch.base_currency = patch.baseCurrency;
  if ('name' in patch) dbPatch.name = patch.name;
  const { error } = await sb.from('budgets').update(dbPatch).eq('id', state.budgetId);
  if (error) throw error;
}

// ---- Accounts ----
async function cloudCreateAccount({ name, currency, opening_balance = 0, sort_order = 0 }) {
  const { data, error } = await sb
    .from('accounts')
    .insert({ budget_id: state.budgetId, name, currency, opening_balance, sort_order })
    .select()
    .single();
  if (error) throw error;
  return { id: data.id, name: data.name, currency: data.currency, opening: parseFloat(data.opening_balance) };
}

async function cloudUpdateAccount(id, patch) {
  const { error } = await sb.from('accounts').update(patch).eq('id', id);
  if (error) throw error;
}

async function cloudDeleteAccount(id) {
  const { error } = await sb.from('accounts').delete().eq('id', id);
  if (error) throw error;
}

// ---- Categories ----
async function cloudCreateCategory(name, kind = 'expense') {
  const { data, error } = await sb
    .from('categories')
    .insert({ budget_id: state.budgetId, name, kind })
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function cloudRenameCategory(oldName, newName, kind = 'expense') {
  const { data: cat, error: e1 } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', oldName)
    .eq('kind', kind)
    .single();
  if (e1) throw e1;
  const { error: e2 } = await sb.from('categories').update({ name: newName }).eq('id', cat.id);
  if (e2) throw e2;
  // Also update txs (category is stored as text, not FK)
  const { error: e3 } = await sb
    .from('transactions')
    .update({ category: newName })
    .eq('budget_id', state.budgetId)
    .eq('category', oldName);
  if (e3) throw e3;
}

async function cloudDeleteCategory(name, kind = 'expense') {
  const { error } = await sb
    .from('categories')
    .delete()
    .eq('budget_id', state.budgetId)
    .eq('name', name)
    .eq('kind', kind);
  if (error) throw error;
}

async function cloudReassignCategory(oldName, newName) {
  const { error } = await sb
    .from('transactions')
    .update({ category: newName, subcategory: '' })
    .eq('budget_id', state.budgetId)
    .eq('category', oldName);
  if (error) throw error;
}

// ---- Subcategories ----
async function cloudCreateSub(categoryName, subName) {
  const { data: cat, error: e1 } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', categoryName)
    .eq('kind', 'expense')
    .single();
  if (e1) throw e1;
  const { error: e2 } = await sb
    .from('subcategories')
    .insert({ category_id: cat.id, name: subName });
  if (e2) throw e2;
}

async function cloudRenameSub(categoryName, oldSub, newSub) {
  const { data: cat } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', categoryName)
    .eq('kind', 'expense')
    .single();
  if (!cat) return;
  const { error: e1 } = await sb
    .from('subcategories')
    .update({ name: newSub })
    .eq('category_id', cat.id)
    .eq('name', oldSub);
  if (e1) throw e1;
  const { error: e2 } = await sb
    .from('transactions')
    .update({ subcategory: newSub })
    .eq('budget_id', state.budgetId)
    .eq('category', categoryName)
    .eq('subcategory', oldSub);
  if (e2) throw e2;
}

async function cloudDeleteSub(categoryName, subName) {
  const { data: cat } = await sb
    .from('categories')
    .select('id')
    .eq('budget_id', state.budgetId)
    .eq('name', categoryName)
    .eq('kind', 'expense')
    .single();
  if (!cat) return;
  const { error: e1 } = await sb
    .from('subcategories')
    .delete()
    .eq('category_id', cat.id)
    .eq('name', subName);
  if (e1) throw e1;
  // Clear subcategory on any transactions using it
  const { error: e2 } = await sb
    .from('transactions')
    .update({ subcategory: '' })
    .eq('budget_id', state.budgetId)
    .eq('category', categoryName)
    .eq('subcategory', subName);
  if (e2) throw e2;
}

// ---- Transactions ----
function txToDb(tx) {
  return {
    budget_id: state.budgetId,
    date: tx.date,
    type: tx.type,
    amount: tx.amount,
    currency: tx.currency,
    fx_rate: tx.fx_rate != null ? tx.fx_rate : null,
    category: tx.category || null,
    subcategory: tx.subcategory || null,
    account_id: tx.account || null,
    comment: tx.comment || null,
    created_by: currentUser ? currentUser.id : null,
  };
}

async function cloudCreateTx(tx) {
  const { data, error } = await sb
    .from('transactions')
    .insert(txToDb(tx))
    .select()
    .single();
  if (error) throw error;
  return data;
}

async function cloudUpdateTx(id, tx) {
  const patch = txToDb(tx);
  delete patch.budget_id;
  delete patch.created_by;
  patch.updated_at = new Date().toISOString();
  const { error } = await sb.from('transactions').update(patch).eq('id', id);
  if (error) throw error;
}

async function cloudDeleteTx(id) {
  const { error } = await sb.from('transactions').delete().eq('id', id);
  if (error) throw error;
}

// ---- Bulk import from xlsx ----
// Called after parseXlsx returns `imported`. Writes everything to the cloud.
async function cloudBulkImport(imported) {
  // 1. Accounts — preserve old IDs → new IDs mapping for transaction account refs
  const accMap = {};
  for (let i = 0; i < imported.accounts.length; i++) {
    const a = imported.accounts[i];
    const opening = imported.openingBalances[a.id] || 0;
    const { data, error } = await sb
      .from('accounts')
      .insert({
        budget_id: state.budgetId,
        name: a.name,
        currency: a.currency,
        opening_balance: opening,
        sort_order: i,
      })
      .select()
      .single();
    if (error) throw error;
    accMap[a.id] = data.id;
  }

  // 2. Categories + subcategories
  let catSortOrder = 0;
  for (const [catName, subs] of Object.entries(imported.categories)) {
    const { data: cat, error: e1 } = await sb
      .from('categories')
      .insert({ budget_id: state.budgetId, name: catName, kind: 'expense', sort_order: catSortOrder++ })
      .select()
      .single();
    if (e1) throw e1;
    if (subs && subs.length > 0) {
      const subRows = subs.map((s, i) => ({ category_id: cat.id, name: s, sort_order: i }));
      const { error: e2 } = await sb.from('subcategories').insert(subRows);
      if (e2) throw e2;
    }
  }

  // 3. Income types (as categories with kind='income')
  let incSortOrder = 0;
  for (const name of imported.incomeTypes) {
    const { error } = await sb
      .from('categories')
      .insert({ budget_id: state.budgetId, name, kind: 'income', sort_order: incSortOrder++ });
    if (error && !String(error.message).includes('duplicate')) throw error;
  }

  // 4. Transactions — batch insert in chunks of 200
  const txRows = imported.transactions.map(t => ({
    budget_id: state.budgetId,
    date: t.date,
    type: t.type,
    amount: t.amount,
    currency: t.currency,
    fx_rate: t.fx_rate != null ? t.fx_rate : null,
    category: t.category || null,
    subcategory: t.subcategory || null,
    account_id: accMap[t.account] || null,
    comment: t.comment || null,
    created_by: currentUser ? currentUser.id : null,
  }));

  const CHUNK = 200;
  for (let i = 0; i < txRows.length; i += CHUNK) {
    const batch = txRows.slice(i, i + CHUNK);
    const { error } = await sb.from('transactions').insert(batch);
    if (error) throw error;
  }
}

// ---- Delete all data in the current budget (for reset) ----
async function cloudWipeBudget() {
  if (!state.budgetId) return;
  // Cascades handle subcategories, transactions via FK on delete cascade if set.
  // But our schema doesn't cascade categories → subcategories (they do),
  // and doesn't cascade accounts → transactions. So delete in order:
  await sb.from('transactions').delete().eq('budget_id', state.budgetId);
  await sb.from('accounts').delete().eq('budget_id', state.budgetId);
  await sb.from('categories').delete().eq('budget_id', state.budgetId);
}

// ============================================================
// INIT (auth-gated)
// ============================================================
async function bootMainApp() {
  // Restore the main app HTML that was there originally
  location.reload(); // simplest: reload to get initial HTML, and init() will now pass auth
}

async function init() {
  // Populate version marker
  const vm = document.getElementById('versionMarker');
  if (vm) vm.textContent = `${window.LEDGER_CONFIG.BUILD_VERSION} · ${window.LEDGER_CONFIG.BUILD_DATE}`;

  const user = await checkAuth();
  if (!user) {
    renderAuthScreen('login');
    return;
  }

  // Show a loading pulse while we talk to the cloud
  const main = document.getElementById('main');
  if (main) main.innerHTML = '<div class="empty"><h2>Loading…</h2><p>Fetching your data from the cloud.</p></div>';

  // Add user menu to the topbar
  const topbarActions = document.querySelector('.topbar-actions');
  if (topbarActions && !document.getElementById('userPill')) {
    const pill = document.createElement('span');
    pill.className = 'user-pill';
    pill.id = 'userPill';
    pill.innerHTML = `<strong>${user.email}</strong> <a onclick="signOut()" style="cursor:pointer; color:var(--accent); margin-left:4px">Sign out</a>`;
    topbarActions.insertBefore(pill, topbarActions.firstChild);
  }

  // ---- CLOUD: bootstrap budget + load data ----
  try {
    // Debug: verify the session has a valid access token
    const { data: sessData } = await sb.auth.getSession();
    console.log('[DEBUG] session user id:', sessData?.session?.user?.id);
    console.log('[DEBUG] has access_token:', !!sessData?.session?.access_token);
    console.log('[DEBUG] currentUser.id:', currentUser?.id);

    const budget = await ensureBudget();
    state.budgetId = budget.id;
    state.fxRate = budget.fxRate;
    state.baseCurrency = budget.baseCurrency;
    document.getElementById('fxRate').value = state.fxRate;

    await loadBudgetData(budget.id);
  } catch (err) {
    console.error('Cloud bootstrap failed:', err);
    if (main) main.innerHTML = `
      <div class="empty">
        <h2>Couldn't load your data</h2>
        <p>${err.message || 'Unknown error'}. Check your internet and try again.</p>
        <button class="btn" onclick="location.reload()">Retry</button>
      </div>`;
    return;
  }

  render();
}

// Auth state change listener (handles signin/signout in other tabs too)
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentUser = null;
    renderAuthScreen('login');
  }
});

init();
