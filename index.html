  html, body { height: 100%; }

<script>
// ============================================================
// STATE
// ============================================================
const STORAGE_KEY = 'ledger-budget-v2';

let state = {
  budgetId: null,     // active budget id (set after login/bootstrap)
  accounts: [],       // [{id, name, currency}]
  categories: {},     // {general: [subcategories]}
  incomeTypes: ['Salary', 'Reimbursement', 'Account adjustment'],
  transactions: [],   // [{id, date, type:'expense'|'income'|'adjustment', amount, currency, category, subcategory, account, comment}]
  openingBalances: {},// {accountId: native-currency-amount}
  fxRate: 0.854,      // 1 USD = X EUR
  baseCurrency: 'EUR',
  activeView: 'dashboard',
  txFilters: { month: 'all', category: 'all', account: 'all', type: 'all', search: '' },
  dashRange: 'YTD', // '1M' | '3M' | 'YTD' | 'All'
  hasData: false,
};

// ============================================================
// STORAGE
// ============================================================
async function saveState() {
  try {
    const toSave = {
      accounts: state.accounts,
      categories: state.categories,
      incomeTypes: state.incomeTypes,
      transactions: state.transactions,
      openingBalances: state.openingBalances,
      fxRate: state.fxRate,
      baseCurrency: state.baseCurrency,
      hasData: state.hasData,
    };
    if (typeof window !== 'undefined' && window.storage) {
      await window.storage.set(STORAGE_KEY, JSON.stringify(toSave));
    } else {
      // Fallback for local testing
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); } catch(e) {}
    }
  } catch (e) {
    console.error('Save failed:', e);
    toast('Save failed');
  }
}

async function loadState() {
  try {
    if (typeof window !== 'undefined' && window.storage) {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          Object.assign(state, data);
          return true;
        }
      } catch (e) { /* key not found */ }
    } else {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) { Object.assign(state, JSON.parse(raw)); return true; }
      } catch(e) {}
    }
  } catch (e) {
    console.error('Load failed:', e);
  }
  return false;
}

// ============================================================
// UTILS
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function fmtEUR(n, opts = {}) {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  const parts = abs.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const prefix = opts.noSymbol ? '' : '€';
  return `${sign}${prefix}${parts.join('.')}`;
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '—';
  const parts = Math.abs(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '−' : '') + parts.join('.');
}

function toEUR(amount, currency) {
  if (!amount) return 0;
  if (currency === 'EUR' || currency === '€') return amount;
  if (currency === 'USD' || currency === '$') return amount * state.fxRate;
  return amount;
}

// Historical-aware EUR conversion: uses the transaction's stored fx_rate
// if present, otherwise falls back to the current global rate.
// This preserves historical values even when today's rate changes.
function txToEUR(tx) {
  if (!tx || !tx.amount) return 0;
  if (tx.currency === 'EUR' || tx.currency === '€') return tx.amount;
  if (tx.currency === 'USD' || tx.currency === '$') {
    const rate = (tx.fx_rate != null && isFinite(tx.fx_rate) && tx.fx_rate > 0)
      ? tx.fx_rate
      : state.fxRate;
    return tx.amount * rate;
  }
  return tx.amount;
}

function monthOfDate(dateStr) {
  // Parse YYYY-MM-DD as local components to avoid UTC shift.
  if (typeof dateStr === 'string') {
    const m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return parseInt(m[2], 10) - 1; // month is 1-12 in string, 0-11 in JS
  }
  const d = new Date(dateStr);
  return d.getMonth();
}
function yearOfDate(dateStr) {
  if (typeof dateStr === 'string') {
    const m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return parseInt(m[1], 10);
  }
  const d = new Date(dateStr);
  return d.getFullYear();
}
function dateStr(d) {
  if (!d) return '';
  if (typeof d === 'string') {
    // Preserve YYYY-MM-DD strings as-is (no TZ conversion)
    const m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    d = new Date(d);
  }
  if (!(d instanceof Date) || isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${mo}-${day}`;
}
function dateDisplay(d) {
  if (!d) return '';
  let dt;
  if (typeof d === 'string') {
    const m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) {
      dt = new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    } else {
      dt = new Date(d);
    }
  } else {
    dt = new Date(d);
  }
  if (isNaN(dt.getTime())) return '';
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ============================================================
// CATEGORY COLORS — Modern Soft warm earthy palette.
// Semantic mapping by keyword, fallback to a stable hash so the
// same category gets the same color everywhere in the app.
// ============================================================
const CAT_PALETTE = ['#c44536', '#d8a64a', '#1a7a4a', '#7daad0', '#a07a9a', '#7a8a4a', '#d97a4a', '#5a7aa8', '#b8895a', '#4a8a7a'];
const CAT_SEMANTIC = [
  { rx: /food|grocer|restaur|cafe|coffee|takeout|drink/i, color: '#d8a64a' },
  { rx: /health|medic|pharma|doctor|fitness/i,           color: '#e08a7a' },
  { rx: /travel|flight|hotel|trip|transit|taxi|uber|train|bus/i, color: '#7daad0' },
  { rx: /home|rent|utilit|mortgage|furniture/i,           color: '#c44536' },
  { rx: /bill|subscription|insurance/i,                   color: '#7a9a6a' },
  { rx: /entertain|music|movie|game|book|netflix|spotify/i, color: '#a07a9a' },
  { rx: /tech|software|hardware|gadget|computer/i,        color: '#5a7aa8' },
  { rx: /pet|kent|dog|cat|vet/i,                          color: '#1a7a4a' },
  { rx: /clothing|cloth|fashion|shopping/i,               color: '#b8895a' },
  { rx: /salary|income|reimburs/i,                        color: '#1a7a4a' },
];
const _catColorCache = {};
function categoryColor(name) {
  if (!name) return '#8a8a98';
  if (_catColorCache[name]) return _catColorCache[name];
  for (const s of CAT_SEMANTIC) {
    if (s.rx.test(name)) { _catColorCache[name] = s.color; return s.color; }
  }
  // Stable hash → palette index
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const c = CAT_PALETTE[h % CAT_PALETTE.length];
  _catColorCache[name] = c;
  return c;
}

function accountById(id) { return state.accounts.find(a => a.id === id); }
function accountByName(name) { return state.accounts.find(a => a.name === name); }

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ============================================================
// DERIVED DATA
// ============================================================
function currentYear() {
  const years = state.transactions.map(t => yearOfDate(t.date)).filter(y => y > 1900);
  return years.length ? Math.max(...years) : new Date().getFullYear();
}

// Returns account balance IN EUR at end of a given month (0-11) of given year.
// Opening balances are stored in native account currency.
// If month = -1, returns opening balance (in EUR).
function accountBalanceAtMonth(accountId, month, year) {
  const acc = accountById(accountId);
  if (!acc) return 0;
  const openingNative = state.openingBalances[accountId] || 0;
  let balanceEUR = toEUR(openingNative, acc.currency);
  if (month < 0) return balanceEUR;

  state.transactions.forEach(tx => {
    const txYear = yearOfDate(tx.date); const txMonth = monthOfDate(tx.date);
    if (txYear > year) return;
    if (txYear === year && txMonth > month) return;
    if (tx.account !== accountId) return;
    const amtEUR = txToEUR(tx);
    if (tx.type === 'expense') balanceEUR -= amtEUR;
    else if (tx.type === 'income') balanceEUR += amtEUR;
    else if (tx.type === 'adjustment') balanceEUR += amtEUR;
  });
  return balanceEUR;
}

// Returns balance in NATIVE currency (for display like "€3,031.27" on a EUR account, "$5,836" on USD)
function accountBalanceNative(accountId, month, year) {
  const acc = accountById(accountId);
  if (!acc) return 0;
  let balance = state.openingBalances[accountId] || 0;
  if (month < 0) return balance;

  state.transactions.forEach(tx => {
    const txYear = yearOfDate(tx.date); const txMonth = monthOfDate(tx.date);
    if (txYear > year) return;
    if (txYear === year && txMonth > month) return;
    if (tx.account !== accountId) return;
    // Convert transaction amount to account's currency if needed
    let amt = tx.amount;
    if (tx.currency !== acc.currency) {
      const eur = txToEUR(tx);
      amt = acc.currency === 'EUR' ? eur : eur / state.fxRate;
    }
    if (tx.type === 'expense') balance -= amt;
    else if (tx.type === 'income') balance += amt;
    else if (tx.type === 'adjustment') balance += amt;
  });
  return balance;
}

function totalBalanceAtMonth(month, year) {
  return state.accounts.reduce((sum, a) => sum + accountBalanceAtMonth(a.id, month, year), 0);
}

function totalBalanceNow() {
  const y = currentYear();
  return totalBalanceAtMonth(11, y); // end of December = latest
}

// Aggregate expenses/income by month for current year
function monthlyTotals(year) {
  const exp = Array(12).fill(0);
  const inc = Array(12).fill(0);
  state.transactions.forEach(tx => {
    if (yearOfDate(tx.date) !== year) return;
    const m = monthOfDate(tx.date);
    const amt = txToEUR(tx);
    if (tx.type === 'expense') exp[m] += amt;
    else if (tx.type === 'income') inc[m] += Math.max(0, amt); // positive income
  });
  return { expenses: exp, income: inc };
}

// Category totals for a given month (or 'all' in year)
function categoryTotals(year, monthFilter) {
  const totals = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense') return;
    if (yearOfDate(tx.date) !== year) return;
    if (monthFilter != null && monthOfDate(tx.date) !== monthFilter) return;
    const amt = txToEUR(tx);
    totals[tx.category] = (totals[tx.category] || 0) + amt;
  });
  return totals;
}

function subcategoryTotals(year, monthFilter, category) {
  const totals = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense') return;
    if (tx.category !== category) return;
    if (yearOfDate(tx.date) !== year) return;
    if (monthFilter != null && monthOfDate(tx.date) !== monthFilter) return;
    const amt = txToEUR(tx);
    const key = tx.subcategory || '(uncategorised)';
    totals[key] = (totals[key] || 0) + amt;
  });
  return totals;
}

// Forecast: average per-category monthly spend based on COMPLETED months
function forecastSpend(year) {
  const { expenses } = monthlyTotals(year);
  // Last month with any spend = last "actual" month
  let lastActual = -1;
  for (let i = 11; i >= 0; i--) {
    if (expenses[i] > 0) { lastActual = i; break; }
  }
  if (lastActual < 0) return { perCategory: {}, perMonth: Array(12).fill(0), lastActual: -1 };

  const monthsCount = lastActual + 1;

  // Per category: avg monthly for each cat over actual months
  const catTotals = {};
  state.transactions.forEach(tx => {
    if (tx.type !== 'expense') return;
    if (yearOfDate(tx.date) !== year) return;
    const m = monthOfDate(tx.date);
    if (m > lastActual) return;
    const amt = txToEUR(tx);
    catTotals[tx.category] = (catTotals[tx.category] || 0) + amt;
  });
  const perCategory = {};
  Object.keys(catTotals).forEach(c => {
    perCategory[c] = { total: catTotals[c], avgMonthly: catTotals[c] / monthsCount };
  });

  // Build projected per-month totals
  const totalAvgMonthly = Object.values(perCategory).reduce((s, v) => s + v.avgMonthly, 0);
  const perMonth = Array(12).fill(0).map((_, i) => i <= lastActual ? expenses[i] : totalAvgMonthly);

  return { perCategory, perMonth, lastActual, monthsCount, totalAvgMonthly };
}

// ============================================================
// XLSX IMPORT - v3 (per-tx FX rates, derive accounts/categories from data)
// ============================================================

// Fetch USD→EUR rate for a specific date from Frankfurter (ECB).
// Returns null if the call fails.
const _fxCache = {};
async function fetchHistoricalFxRate(dateStr) {
  if (_fxCache[dateStr] !== undefined) return _fxCache[dateStr];
  try {
    // Frankfurter returns the rate for the given date, or the nearest prior
    // business day if it's a weekend/holiday.
    const res = await fetch(`https://api.frankfurter.dev/v1/${dateStr}?from=USD&to=EUR`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rate = data && data.rates && data.rates.EUR;
    if (!rate || !isFinite(rate)) throw new Error('bad rate');
    _fxCache[dateStr] = rate;
    return rate;
  } catch (e) {
    console.warn('FX fetch failed for', dateStr, e);
    _fxCache[dateStr] = null;
    return null;
  }
}

// Fetch rates for many dates in parallel (with a concurrency cap).
async function fetchRatesForDates(dates) {
  const unique = Array.from(new Set(dates));
  const CHUNK = 10;
  for (let i = 0; i < unique.length; i += CHUNK) {
    const batch = unique.slice(i, i + CHUNK);
    await Promise.all(batch.map(d => fetchHistoricalFxRate(d)));
  }
}

// Excel serial → JS Date (local midnight)
function excelSerialToDate(n) {
  // Excel serial counts days since 1899-12-30. We create a Date at local midnight
  // of that day to avoid timezone shifts.
  const epoch = new Date(1899, 11, 30); // 1899-12-30 local
  return new Date(epoch.getTime() + Math.round(n) * 86400 * 1000);
}

// Format any Date as YYYY-MM-DD in LOCAL time (not UTC).
// This avoids the "midnight local = previous day UTC" bug where toISOString()
// would shift the date by one day for anyone east of UTC.
function toLocalISODate(d) {
  if (!(d instanceof Date) || isNaN(d.getTime())) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Normalize any date-like value into a YYYY-MM-DD string (local-time),
// or null if unparseable.
function normalizeDate(cellVal) {
  if (cellVal == null || cellVal === '') return null;
  if (cellVal instanceof Date) return toLocalISODate(cellVal);
  if (typeof cellVal === 'number') return toLocalISODate(excelSerialToDate(cellVal));
  if (typeof cellVal === 'string') {
    // Prefer parsing YYYY-MM-DD literally without TZ conversion
    const m = cellVal.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    const d = new Date(cellVal);
    return toLocalISODate(d);
  }
  return null;
}

// Detect currency from an account name like "Deel, $" or "Cash, €"
function detectCurrency(accountName) {
  if (!accountName) return 'EUR';
  const s = String(accountName).trim();
  if (s.endsWith('$') || s.includes(', $')) return 'USD';
  return 'EUR';
}

let currentImportYear = 2026;

// Main parser — returns { transactions, accounts, categories, incomeTypes, openingBalances }
// Everything EXCEPT opening balances is derived from transaction rows themselves.
function parseXlsxRaw(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });

  const transactions = [];  // will be populated below
  const accountsByName = new Map(); // name -> { name, currency }
  const categoriesMap = new Map();  // cat name -> Set of subcategory names (expense only)
  const incomeTypesSet = new Set();
  const openingBalances = {}; // keyed by account name (remapped to id later)

  // ---- 1. Opening balances from Accounts Balance sheet ----
  if (wb.SheetNames.includes('Accounts Balance')) {
    const ws = wb.Sheets['Accounts Balance'];
    const range = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : null;
    if (range) {
      let headerRow = -1;
      for (let r = range.s.r; r <= range.e.r; r++) {
        const c = ws[XLSX.utils.encode_cell({ r, c: 1 })];
        if (c && c.v === 'Account') { headerRow = r; break; }
      }
      if (headerRow >= 0) {
        for (let r = headerRow + 1; r <= range.e.r; r++) {
          const nameCell = ws[XLSX.utils.encode_cell({ r, c: 1 })];
          const eurCell  = ws[XLSX.utils.encode_cell({ r, c: 2 })];
          const usdCell  = ws[XLSX.utils.encode_cell({ r, c: 3 })];
          if (!nameCell || nameCell.v == null) continue;
          const name = String(nameCell.v).trim();
          if (!name || name === 'TOTAL') continue;
          const currency = detectCurrency(name);
          accountsByName.set(name, { name, currency });
          // Opening balance in native currency
          let opening = 0;
          if (currency === 'USD' && usdCell && typeof usdCell.v === 'number') {
            opening = usdCell.v;
          } else if (eurCell && typeof eurCell.v === 'number') {
            opening = eurCell.v;
          }
          openingBalances[name] = opening;
        }
      }
    }
  }

  // ---- 2. Walk every monthly sheet, pulling each transaction ----
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Debug collection
  const _debug = { dropped: [], kept: {}, parsedRaw: {} };

  MONTHS.forEach((monthName, monthIdx) => {
    if (!wb.SheetNames.includes(monthName)) return;
    const ws = wb.Sheets[monthName];
    if (!ws['!ref']) return;
    const range = XLSX.utils.decode_range(ws['!ref']);

    // Find header row ('Date' in col B, i.e. index 1)
    let headerRow = -1;
    for (let r = range.s.r; r <= Math.min(range.s.r + 10, range.e.r); r++) {
      const c = ws[XLSX.utils.encode_cell({ r, c: 1 })];
      if (c && c.v === 'Date') { headerRow = r; break; }
    }
    if (headerRow < 0) return;

    _debug.kept[monthName] = { exp: 0, inc: 0, adj: 0 };
    _debug.parsedRaw[monthName] = { exp_amount_rows: 0, inc_amount_rows: 0, sheet_range: ws['!ref'], header_row: headerRow };

    for (let r = headerRow + 1; r <= range.e.r; r++) {
      // ---- EXPENSE-SIDE ROW (cols B-G = indices 1-6) ----
      const expDate = ws[XLSX.utils.encode_cell({ r, c: 1 })];
      const expAmt  = ws[XLSX.utils.encode_cell({ r, c: 2 })];
      const expCat  = ws[XLSX.utils.encode_cell({ r, c: 3 })];
      const expSub  = ws[XLSX.utils.encode_cell({ r, c: 4 })];
      const expCmt  = ws[XLSX.utils.encode_cell({ r, c: 5 })];
      const expAcc  = ws[XLSX.utils.encode_cell({ r, c: 6 })];

      const hasExpAmount = expAmt && typeof expAmt.v === 'number' && expAmt.v !== 0;
      if (hasExpAmount) {
        _debug.parsedRaw[monthName].exp_amount_rows++;
        const accName = expAcc && expAcc.v ? String(expAcc.v).trim() : null;
        const dateISO = expDate ? normalizeDate(expDate.v) : null;
        const cat = expCat && expCat.v ? String(expCat.v).trim() : '';
        const sub = expSub && expSub.v ? String(expSub.v).trim() : '';
        const cmt = expCmt && expCmt.v ? String(expCmt.v).trim() : '';

        if (accName && dateISO) {
          if (!accountsByName.has(accName)) {
            accountsByName.set(accName, { name: accName, currency: detectCurrency(accName) });
          }
          const acc = accountsByName.get(accName);

          const isAdjustment = cat === 'Account adjustment';
          if (!isAdjustment && cat) {
            if (!categoriesMap.has(cat)) categoriesMap.set(cat, new Set());
            if (sub) categoriesMap.get(cat).add(sub);
          }
          if (isAdjustment) _debug.kept[monthName].adj++;
          else _debug.kept[monthName].exp++;
          transactions.push({
            _accName: accName,
            date: dateISO,
            type: isAdjustment ? 'adjustment' : 'expense',
            amount: isAdjustment ? -Math.abs(expAmt.v) : Math.abs(expAmt.v),
            currency: acc.currency,
            category: cat,
            subcategory: isAdjustment ? '' : sub,
            comment: cmt,
          });
        } else {
          _debug.dropped.push({
            sheet: monthName, row: r+1, side: 'expense',
            amt: expAmt.v, cat, acc: accName,
            dateRaw: expDate && expDate.v, dateType: expDate && typeof expDate.v,
            dateParsed: dateISO, reason: !accName ? 'no-account' : 'bad-date'
          });
        }
      }

      // ---- INCOME-SIDE ROW (cols I-L = indices 8-11) ----
      const incAmt = ws[XLSX.utils.encode_cell({ r, c: 8 })];
      const incTyp = ws[XLSX.utils.encode_cell({ r, c: 9 })];
      const incCmt = ws[XLSX.utils.encode_cell({ r, c: 10 })];
      const incAcc = ws[XLSX.utils.encode_cell({ r, c: 11 })];

      const hasIncAmount = incAmt && typeof incAmt.v === 'number' && incAmt.v !== 0;
      const hasIncType = incTyp && incTyp.v;
      if (hasIncAmount && hasIncType) {
        const accName = incAcc && incAcc.v ? String(incAcc.v).trim() : null;
        const typeStr = String(incTyp.v).trim();
        const cmt = incCmt && incCmt.v ? String(incCmt.v).trim() : '';

        if (accName) {
          if (!accountsByName.has(accName)) {
            accountsByName.set(accName, { name: accName, currency: detectCurrency(accName) });
          }
          const acc = accountsByName.get(accName);

          const isAdjustment = typeStr === 'Account adjustment';
          if (!isAdjustment) incomeTypesSet.add(typeStr);

          // Income date: sheet has no per-row date; use 28th of the month
          const d = new Date(currentImportYear, monthIdx, 28);
          transactions.push({
            _accName: accName,
            date: toLocalISODate(d),
            type: isAdjustment ? 'adjustment' : 'income',
            amount: Math.abs(incAmt.v),
            currency: acc.currency,
            category: typeStr,
            subcategory: '',
            comment: cmt,
          });
        }
      }
    }
  });

  // ---- 3. Assemble output ----
  const accounts = [];
  const nameToId = {};
  let accountIdx = 0;
  for (const [name, info] of accountsByName) {
    const id = uid();
    accounts.push({ id, name, currency: info.currency });
    nameToId[name] = id;
    accountIdx++;
  }

  // Remap opening balances to account IDs
  const openingById = {};
  for (const [name, amt] of Object.entries(openingBalances)) {
    if (nameToId[name]) openingById[nameToId[name]] = amt;
  }
  // Any account found only in transactions gets opening = 0
  for (const acc of accounts) {
    if (!(acc.id in openingById)) openingById[acc.id] = 0;
  }

  // Replace _accName with actual account ID, assign tx IDs
  const finalTransactions = transactions.map(t => ({
    id: uid(),
    date: t.date,
    type: t.type,
    amount: t.amount,
    currency: t.currency,
    fx_rate: null, // will be filled in for USD transactions below
    category: t.category,
    subcategory: t.subcategory,
    account: nameToId[t._accName],
    comment: t.comment,
  }));

  // Categories map → { name: [subs] }
  const categories = {};
  for (const [cat, subsSet] of categoriesMap) {
    categories[cat] = Array.from(subsSet).sort();
  }

  // Income types
  const incomeTypes = incomeTypesSet.size > 0
    ? Array.from(incomeTypesSet)
    : ['Salary', 'Reimbursement'];
  // Always include 'Account adjustment' as a known type even though it's handled specially
  if (!incomeTypes.includes('Account adjustment')) incomeTypes.push('Account adjustment');

  // ---- Expose debug data to window for inspection ----
  window.LEDGER_DEBUG = _debug;
  console.log('%c[LEDGER IMPORT DEBUG]', 'background:#c44536;color:#fff;padding:2px 6px;border-radius:3px');
  console.log('Raw rows seen per month:', _debug.parsedRaw);
  console.log('Kept per month:', _debug.kept);
  console.log(`Dropped ${_debug.dropped.length} rows total. First 20:`, _debug.dropped.slice(0, 20));
  if (_debug.dropped.length > 0) {
    console.table(_debug.dropped.slice(0, 50));
  }

  return {
    accounts,
    categories,
    incomeTypes,
    transactions: finalTransactions,
    openingBalances: openingById,
  };
}

async function importXlsx(file) {
  const buf = await file.arrayBuffer();
  const match = (file.name || '').match(/(\d{4})/);
  currentImportYear = match ? parseInt(match[1]) : new Date().getFullYear();

  toast('Parsing xlsx...');
  const imported = parseXlsxRaw(buf);

  // Fetch historical FX rates for every USD tx date
  const usdDates = imported.transactions
    .filter(t => t.currency === 'USD')
    .map(t => t.date);

  if (usdDates.length > 0) {
    toast(`Fetching ${new Set(usdDates).size} historical FX rates...`);
    await fetchRatesForDates(usdDates);
    const todayRate = state.fxRate || 0.854;
    imported.transactions.forEach(t => {
      if (t.currency === 'USD') {
        t.fx_rate = _fxCache[t.date] || todayRate;
      }
    });
  }

  // Push everything to the cloud
  try {
    toast('Uploading to cloud…');
    // Wipe any existing data for this budget first (fresh import)
    await cloudWipeBudget();

    await cloudBulkImport(imported);

    // Refresh state from cloud
    await loadBudgetData(state.budgetId);

    toast(`Imported ${imported.transactions.length} tx / ${imported.accounts.length} accounts`);
    // Per-month diagnostic
    const perMonth = {};
    imported.transactions.forEach(t => {
      const m = t.date.slice(0, 7);
      perMonth[m] = (perMonth[m] || 0) + 1;
    });
    console.log('Transactions per month:', perMonth);

    render();
  } catch (err) {
    console.error('Cloud upload failed:', err);
    toast('Upload failed: ' + (err.message || 'unknown'));
  }
}

function exportData() {
  const json = JSON.stringify({
    accounts: state.accounts,
    categories: state.categories,
    incomeTypes: state.incomeTypes,
    transactions: state.transactions,
    openingBalances: state.openingBalances,
    fxRate: state.fxRate,
    exportedAt: new Date().toISOString(),
  }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ledger-export-${dateStr(new Date())}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Exported to JSON');
}

// VIEWS
// ============================================================
function render() {
  const main = document.getElementById('main');
  // Nav active state
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.activeView);
  });
  document.getElementById('fxRate').value = state.fxRate;

  if (!state.hasData) {
    renderEmpty();
    return;
  }

  switch (state.activeView) {
    case 'dashboard': renderDashboard(); break;
    case 'transactions': renderTransactions(); break;
    case 'accounts': renderAccounts(); break;
    case 'categories': renderCategories(); break;
    case 'forecast': renderForecast(); break;
  }
}

function renderEmpty() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="empty">
      <h2>Welcome to Ledger</h2>
      <p>Import your existing budget spreadsheet or start a fresh one.</p>
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📂</div>
        <div><strong>Drop your Budget .xlsx here</strong></div>
        <div class="fine" style="margin-top:6px">or click to browse</div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
      </div>
      <div style="margin-top:20px">
        <button class="btn" id="btnStartFresh">Start empty</button>
      </div>
    </div>
  `;
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');
  dz.onclick = () => fi.click();
  fi.onchange = (e) => { if (e.target.files[0]) importXlsx(e.target.files[0]); };
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('dragover'); };
  dz.ondragleave = () => dz.classList.remove('dragover');
  dz.ondrop = (e) => {
    e.preventDefault(); dz.classList.remove('dragover');
    if (e.dataTransfer.files[0]) importXlsx(e.dataTransfer.files[0]);
  };
  document.getElementById('btnStartFresh').onclick = startFresh;
}

async function startFresh() {
  state.accounts = [{ id: uid(), name: 'Main', currency: 'EUR' }];
  state.categories = {
    'Food': ['Groceries', 'Restaurants', 'Takeout/Cafe'],
    'Home': ['Rent', 'Utilities'],
    'Transit': ['Taxi', 'Public'],
    'Misc': ['Other'],
  };

  state.hasData = true;

// ------------- DASHBOARD -------------
// Build 2 — Modern Soft layout: dark navy hero, 4 metric tiles,
// monthly flow w/ projected future months, savings rate trend,
// category donut + list with category colors, recent activity.
function renderDashboard() {
  const year = currentYear();
  const { expenses, income } = monthlyTotals(year);

  // Last month with any data = current month for stats
  let lastMonth = -1;
  for (let i = 11; i >= 0; i--) if (expenses[i] > 0 || income[i] > 0) { lastMonth = i; break; }

  const thisMonthExp = lastMonth >= 0 ? expenses[lastMonth] : 0;
  const thisMonthInc = lastMonth >= 0 ? income[lastMonth] : 0;
  const thisMonthNet = thisMonthInc - thisMonthExp;
  const ytdExp = expenses.reduce((s, x) => s + x, 0);
  const ytdInc = income.reduce((s, x) => s + x, 0);

  // Avg monthly spend over completed months
  const monthsWithData = expenses.slice(0, lastMonth + 1).filter((e, i) => e > 0 || income[i] > 0).length || 1;
  const avgMonthlyExp = ytdExp / monthsWithData;

  // Savings rate: (income - expenses) / income, YTD
  const savingsRate = ytdInc > 0 ? ((ytdInc - ytdExp) / ytdInc) * 100 : 0;

  // Projected EOY balance: today's balance + projected forward to Dec
  const totalBalance = totalBalanceNow();
  const balNowAtLastMonth = lastMonth >= 0 ? totalBalanceAtMonth(lastMonth, year) : totalBalance;
  const monthsRemaining = lastMonth >= 0 ? (11 - lastMonth) : 0;
  const avgMonthlyNet = monthsWithData > 0 ? (ytdInc - ytdExp) / monthsWithData : 0;
  const projectedEOY = balNowAtLastMonth + avgMonthlyNet * monthsRemaining;

  // Prev-month deltas
  const prevMonthExp = lastMonth > 0 ? expenses[lastMonth - 1] : 0;
  const expDelta = prevMonthExp ? ((thisMonthExp - prevMonthExp) / prevMonthExp * 100) : 0;

  // Time range pills — affect only the hero balance display label/sparkline window
  const range = state.dashRange || 'YTD';
  const balSeries = Array(12).fill(null).map((_, m) => totalBalanceAtMonth(m, year));
  let sparkSlice = balSeries.slice(0, lastMonth + 1);
  if (range === '1M') sparkSlice = sparkSlice.slice(-2);
  else if (range === '3M') sparkSlice = sparkSlice.slice(-3);
  // 'YTD' / 'All' = full slice for now (we only have one year of data)

  const balDelta = sparkSlice.length >= 2 ? (totalBalance - sparkSlice[0]) : 0;
  const balDeltaPct = sparkSlice.length >= 2 && sparkSlice[0] ? (balDelta / Math.abs(sparkSlice[0]) * 100) : 0;

  // Savings-rate trend: per-month savings rate, YTD
  const savingsSeries = Array(12).fill(null).map((_, m) => {
    if (m > lastMonth) return null;
    const inc = income[m]; const exp = expenses[m];
    if (!inc) return null;
    return ((inc - exp) / inc) * 100;
  });

  // Category totals (YTD)
  const cats = categoryTotals(year, null);
  const totalCat = Object.values(cats).reduce((s, v) => s + v, 0);
  const sortedCats = Object.entries(cats).sort((a, b) => b[1] - a[1]);

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="dash-hero">
      <div class="dash-hero-top">
        <div>
          <div class="dash-hero-label">Total balance</div>
          <div class="dash-hero-value">${fmtEUR(totalBalance)}</div>
          <div class="dash-hero-sub">
            ${state.accounts.length} accounts · base EUR
            ${balDelta !== 0 ? ` · <span style="color:${balDelta >= 0 ? '#7ad0a8' : '#e8a59b'}">${balDelta >= 0 ? '↑' : '↓'} ${fmtEUR(Math.abs(balDelta))} (${balDeltaPct.toFixed(1)}%)</span>` : ''}
          </div>
        </div>
        <div class="seg-pills" id="dashRangePills">
          ${['1M','3M','YTD','All'].map(r => `<button data-range="${r}" class="${range === r ? 'active' : ''}">${r}</button>`).join('')}
        </div>
      </div>
      <div class="dash-hero-spark"><canvas id="chartSpark"></canvas></div>
    </div>

    <div class="metric-grid">
      <div class="metric-tile">
        <div class="metric-label">This month net</div>
        <div class="metric-value" style="color:${thisMonthNet >= 0 ? 'var(--sage)' : 'var(--terracotta)'}">${thisMonthNet >= 0 ? '+' : ''}${fmtEUR(thisMonthNet)}</div>
        <div class="metric-sub">${lastMonth >= 0 ? MONTHS[lastMonth] : '—'} · ${fmtEUR(thisMonthInc)} in / ${fmtEUR(thisMonthExp)} out</div>
      </div>
      <div class="metric-tile">
        <div class="metric-label">Avg monthly spend</div>
        <div class="metric-value">${fmtEUR(avgMonthlyExp)}</div>
        <div class="metric-sub ${expDelta < 0 ? 'pos' : expDelta > 0 ? 'neg' : ''}">
          ${expDelta === 0 ? `over ${monthsWithData} mo` : (expDelta > 0 ? '↑' : '↓') + ' ' + Math.abs(expDelta).toFixed(1) + '% vs. prev mo'}
        </div>
      </div>
      <div class="metric-tile">
        <div class="metric-label">Savings rate</div>
        <div class="metric-value" style="color:${savingsRate >= 20 ? 'var(--sage)' : savingsRate >= 0 ? 'var(--ink)' : 'var(--terracotta)'}">${savingsRate.toFixed(0)}%</div>
        <div class="metric-sub">YTD · ${fmtEUR(ytdInc - ytdExp)} saved</div>
      </div>
      <div class="metric-tile">
        <div class="metric-label">Projected EOY</div>
        <div class="metric-value">${fmtEUR(projectedEOY)}</div>
        <div class="metric-sub">${monthsRemaining > 0 ? `${monthsRemaining} mo to go · ${avgMonthlyNet >= 0 ? '+' : ''}${fmtEUR(avgMonthlyNet)}/mo` : 'year complete'}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">
          Monthly flow
          <span class="card-title-sub">${year} · projected in tan</span>
        </div>
        <div class="chart-wrap"><canvas id="chartFlow"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          Savings rate
          <span class="card-title-sub">YTD trend</span>
        </div>
        <div class="chart-wrap"><canvas id="chartSavings"></canvas></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">
          Spending by category
          <span class="card-title-sub">YTD · ${fmtEUR(totalCat)}</span>
        </div>
        ${sortedCats.length === 0 ? '<p class="fine">No expenses yet.</p>' : `
          <div style="display:grid; grid-template-columns: 160px 1fr; gap: 18px; align-items: center;">
            <div style="position:relative; height:160px"><canvas id="chartDonut"></canvas></div>
            <div id="catList" style="min-width:0"></div>
          </div>
        `}
      </div>
      <div class="card">
        <div class="card-title">
          Recent activity
          <span class="card-title-sub">last 8</span>
        </div>
        <div id="recentTx"></div>
      </div>
    </div>
  `;

  // ---- Sparkline (hero) ----
  const sparkCtx = document.getElementById('chartSpark');
  new Chart(sparkCtx, {
    type: 'line',
    data: {
      labels: sparkSlice.map((_, i) => i),
      datasets: [{
        data: sparkSlice,
        borderColor: 'rgba(255,255,255,0.85)',
        backgroundColor: 'rgba(255,255,255,0.12)',
        fill: true, tension: 0.35, borderWidth: 2,
        pointRadius: 0, pointHoverRadius: 4, pointBackgroundColor: '#fff'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => fmtEUR(ctx.parsed.y) } }
      },
      scales: { x: { display: false }, y: { display: false } }
    }
  });

  // ---- Monthly flow (with projected future months in muted tan) ----
  const projectedTan = '#d8c4a4';
  const incomeColors = income.map((_, i) => i <= lastMonth ? '#1a7a4a' : projectedTan);
  const expenseColors = expenses.map((_, i) => i <= lastMonth ? '#c44536' : projectedTan);

  // Project future months using YTD averages
  const avgInc = monthsWithData > 0 ? ytdInc / monthsWithData : 0;
  const avgExp = monthsWithData > 0 ? ytdExp / monthsWithData : 0;
  const incomeFull = income.map((v, i) => i <= lastMonth ? v : avgInc);
  const expensesFull = expenses.map((v, i) => i <= lastMonth ? v : avgExp);

  const ctxFlow = document.getElementById('chartFlow');
  new Chart(ctxFlow, {
    type: 'bar',
    data: {
      labels: MONTHS_SHORT,
      datasets: [
        { label: 'Income', data: incomeFull, backgroundColor: incomeColors, borderRadius: 6, borderSkipped: false },
        { label: 'Expenses', data: expensesFull.map(e => -e), backgroundColor: expenseColors, borderRadius: 6, borderSkipped: false },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, font: { family: 'Inter Tight', size: 11 }, color: '#4a4a5a' } },
        tooltip: {
          backgroundColor: '#1a1a2e', titleColor: '#fff', bodyColor: '#fff',
          padding: 10, cornerRadius: 8, displayColors: false,
          callbacks: {
            label: (ctx) => {
              const isProj = ctx.dataIndex > lastMonth;
              return ctx.dataset.label + ': ' + fmtEUR(Math.abs(ctx.parsed.y)) + (isProj ? ' (projected)' : '');
            }
          }
        }
      },
      scales: {
        x: { stacked: false, grid: { display: false }, ticks: { font: { family: 'Inter Tight', size: 11 }, color: '#8a8a98' } },
        y: { grid: { color: '#f0ece4' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#8a8a98', callback: (v) => fmtEUR(v, {noSymbol: true}) } }
      }
    }
  });

  // ---- Savings rate trend ----
  const ctxSav = document.getElementById('chartSavings');
  new Chart(ctxSav, {
    type: 'line',
    data: {
      labels: MONTHS_SHORT,
      datasets: [{
        label: 'Savings rate',
        data: savingsSeries,
        borderColor: '#1a7a4a',
        backgroundColor: 'rgba(26,122,74,0.10)',
        fill: true, tension: 0.35, borderWidth: 2.5,
        pointRadius: 3, pointBackgroundColor: '#1a7a4a',
        spanGaps: true,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1a2e', titleColor: '#fff', bodyColor: '#fff',
          padding: 10, cornerRadius: 8, displayColors: false,
          callbacks: { label: (ctx) => ctx.parsed.y == null ? '—' : ctx.parsed.y.toFixed(1) + '%' }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'Inter Tight', size: 11 }, color: '#8a8a98' } },
        y: { grid: { color: '#f0ece4' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, color: '#8a8a98', callback: (v) => v + '%' } }
      }
    }
  });

  // ---- Category donut + list ----
  if (sortedCats.length > 0) {
    const ctxDonut = document.getElementById('chartDonut');
    new Chart(ctxDonut, {
      type: 'doughnut',
      data: {
        labels: sortedCats.map(([c]) => c),
        datasets: [{
          data: sortedCats.map(([, v]) => v),
          backgroundColor: sortedCats.map(([c]) => categoryColor(c)),
          borderColor: '#fff', borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        cutout: '68%',
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a1a2e', titleColor: '#fff', bodyColor: '#fff',
            padding: 10, cornerRadius: 8,
            callbacks: {
              label: (ctx) => {
                const pct = totalCat ? (ctx.parsed / totalCat * 100).toFixed(1) : '0.0';
                return ctx.label + ': ' + fmtEUR(ctx.parsed) + ' (' + pct + '%)';
              }
            }
          }
        }
      }
    });

    document.getElementById('catList').innerHTML = sortedCats.slice(0, 7).map(([cat, amt]) => {
      const pct = totalCat ? (amt / totalCat * 100) : 0;
      const color = categoryColor(cat);
      return `
        <div class="dash-cat-row" data-cat="${cat.replace(/"/g,'&quot;')}">
          <span class="cat-dot" style="background:${color}"></span>
          <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${cat}</div>
          <div class="amt">${fmtEUR(amt)}</div>
          <div class="pct">${pct.toFixed(1)}%</div>
        </div>
      `;
    }).join('');

    // Click-through to filtered Transactions view (drill-down modal lands in Build 4)
    document.querySelectorAll('.dash-cat-row').forEach(row => {
      row.onclick = () => {
        state.txFilters = { month: 'all', category: row.dataset.cat, account: 'all', type: 'all', search: '' };
        state.activeView = 'transactions';
        render();
      };
    });
  }

  // ---- Recent activity ----
  const recent = [...state.transactions]
    .sort((a, b) => new Date(b.date) - new Date(a.date))
    .slice(0, 8);
  document.getElementById('recentTx').innerHTML = recent.length === 0
    ? '<p class="fine">No transactions.</p>'
    : recent.map(tx => {
      const acc = accountById(tx.account);
      const sign = tx.type === 'expense' ? '−' : tx.type === 'income' ? '+' : (tx.amount >= 0 ? '+' : '−');
      const amtClass = tx.type === 'expense' ? 'amt-exp' : tx.type === 'income' ? 'amt-inc' : 'amt-adj';
      const amtEUR = toEUR(Math.abs(tx.amount), tx.currency);
      const color = categoryColor(tx.category);
      return `
        <div class="recent-row" onclick="openEditTx('${tx.id}')">
          <span class="cat-dot" style="background:${color}"></span>
          <div class="recent-meta">
            <span class="recent-cat">${tx.category}${tx.subcategory ? ' · ' + tx.subcategory : ''}</span>
            <span class="recent-sub">${dateDisplay(tx.date)}${acc ? ' · ' + acc.name : ''}${tx.comment ? ' · ' + tx.comment : ''}</span>
          </div>
          <span class="amt ${amtClass}">${sign}${fmtEUR(amtEUR)}</span>
        </div>
      `;
    }).join('');

  // ---- Time-range pills ----
  document.querySelectorAll('#dashRangePills button').forEach(b => {
    b.onclick = () => { state.dashRange = b.dataset.range; renderDashboard(); };
  });
}

function txRow(tx, opts = {}) {
  const acc = accountById(tx.account);
  const amtClass = tx.type === 'expense' ? 'amt-exp' : tx.type === 'income' ? 'amt-inc' : 'amt-adj';
  const sign = tx.type === 'expense' ? '−' : tx.type === 'income' ? '+' : (tx.amount >= 0 ? '+' : '−');
  const amtEUR = toEUR(Math.abs(tx.amount), tx.currency);
  const typePill = tx.type === 'expense' ? '' : `<span class="pill pill-${tx.type === 'income' ? 'income' : 'adjust'}">${tx.type}</span>`;
  if (opts.compact) {
    return `
      <tr class="tx-row" onclick="openEditTx('${tx.id}')">
        <td class="mono" style="color:var(--ink-mute); width: 70px">${dateDisplay(tx.date)}</td>
        <td>${tx.category}${tx.subcategory ? ' <span class="tag-n">· ' + tx.subcategory + '</span>' : ''}</td>
        <td style="text-align:right" class="amt ${amtClass}">${sign}${fmtEUR(amtEUR)}</td>
      </tr>
    `;
  }
  return `
    <tr class="tx-row" onclick="openEditTx('${tx.id}')">
      <td class="mono" style="color:var(--ink-mute)">${dateDisplay(tx.date)}</td>
      <td>${typePill}<span class="pill pill-cat">${tx.category}</span>${tx.subcategory ? '<span class="pill pill-sub">' + tx.subcategory + '</span>' : ''}</td>
      <td>${tx.comment || '<span class="fine">—</span>'}</td>
      <td><span class="pill pill-acc">${acc ? acc.name : '?'}</span></td>
      <td style="text-align:right" class="amt ${amtClass}">${sign}${fmtNum(Math.abs(tx.amount))} ${tx.currency === 'USD' ? '$' : '€'}</td>
      <td style="text-align:right; color:var(--ink-mute); font-size:11px" class="mono">${fmtEUR(amtEUR)}</td>
    </tr>
  `;
}

// Format an amount with the correct currency symbol
function fmtAmt(n, currency) {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '−' : '';
  const parts = abs.toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const sym = currency === 'USD' ? '$' : '€';
  return `${sign}${sym}${parts.join('.')}`;
}

function escapeAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

async function addCategory() {
  const name = prompt('New category name:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.categories[trimmed]) { toast('Category already exists'); return; }
  try {
    await cloudCreateCategory(trimmed, 'expense');
    state.categories[trimmed] = [];
    render();
    toast('Added');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function renameCategory(oldName) {
  const name = prompt('Rename category:', oldName);
  if (!name || !name.trim() || name === oldName) return;
  const trimmed = name.trim();
  if (state.categories[trimmed]) { toast('Name already in use'); return; }
  try {
    await cloudRenameCategory(oldName, trimmed, 'expense');
    state.categories[trimmed] = state.categories[oldName];
    delete state.categories[oldName];
    state.transactions.forEach(tx => { if (tx.category === oldName) tx.category = trimmed; });
    render();
    toast('Renamed');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function deleteCategory(name) {
  const txCount = state.transactions.filter(tx => tx.category === name).length;
  const msg = txCount > 0
    ? `Delete "${name}"? ${txCount} transaction${txCount > 1 ? 's' : ''} use this category and will be moved to "Misc".`
    : `Delete "${name}"?`;
  if (!confirm(msg)) return;
  try {
    if (txCount > 0) {
      // Ensure "Misc" category exists in cloud
      if (!state.categories['Misc']) {
        await cloudCreateCategory('Misc', 'expense');
        state.categories['Misc'] = [];
      }
      await cloudReassignCategory(name, 'Misc');
      state.transactions.forEach(tx => {
        if (tx.category === name) { tx.category = 'Misc'; tx.subcategory = ''; }
      });
    }
    await cloudDeleteCategory(name, 'expense');
    delete state.categories[name];
    render();
    toast('Deleted');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function addSub(cat) {
  const name = prompt(`New sub-category under "${cat}":`);
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.categories[cat].includes(trimmed)) { toast('Already exists'); return; }
  try {
    await cloudCreateSub(cat, trimmed);
    state.categories[cat].push(trimmed);
    render();
    toast('Added');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function renameSub(cat, oldName) {
  const name = prompt('Rename sub-category:', oldName);
  if (!name || !name.trim() || name === oldName) return;
  const trimmed = name.trim();
  if (state.categories[cat].includes(trimmed)) { toast('Name already in use'); return; }
  const i = state.categories[cat].indexOf(oldName);
  if (i < 0) return;
  try {
    await cloudRenameSub(cat, oldName, trimmed);
    state.categories[cat][i] = trimmed;
    state.transactions.forEach(tx => {
      if (tx.category === cat && tx.subcategory === oldName) tx.subcategory = trimmed;
    });
    render();
    toast('Renamed');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function deleteSub(cat, name) {
  const txCount = state.transactions.filter(tx => tx.category === cat && tx.subcategory === name).length;
  const msg = txCount > 0
    ? `Delete sub-category "${name}"? ${txCount} transaction${txCount > 1 ? 's' : ''} will have their sub-category cleared.`
    : `Delete sub-category "${name}"?`;
  if (!confirm(msg)) return;
  try {
    await cloudDeleteSub(cat, name);
    state.categories[cat] = state.categories[cat].filter(s => s !== name);
    state.transactions.forEach(tx => {
      if (tx.category === cat && tx.subcategory === name) tx.subcategory = '';
    });
    render();
    toast('Deleted');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

  const acc = editId ? state.accounts.find(a => a.id === editId) : null;
  const opening = editId ? (state.openingBalances[editId] || 0) : 0;
  const txCount = editId ? state.transactions.filter(t => t.account === editId).length : 0;

  const modalHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>${editId ? 'Edit' : 'New'} account</h3>
          <button class="btn btn-sm btn-ghost" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <label>Name</label>
            <input type="text" id="acName" value="${acc ? String(acc.name).replace(/"/g,'&quot;') : ''}" placeholder="e.g. Sparkasse, Cash, Crypto" autofocus>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label>Base currency</label>
              <select id="acCurrency">
                <option value="EUR" ${!acc || acc.currency === 'EUR' ? 'selected' : ''}>EUR €</option>
                <option value="USD" ${acc && acc.currency === 'USD' ? 'selected' : ''}>USD $</option>
              </select>
            </div>
            <div class="form-row">
              <label>Opening balance</label>
              <input type="number" step="0.01" id="acOpening" value="${opening}" placeholder="0.00">
            </div>
          </div>
          ${editId ? `<div class="fine" style="margin-top:8px">Currency determines how new transactions on this account are recorded. Changing it will <strong>not</strong> convert existing transactions.</div>` : ''}
          ${txCount > 0 ? `<div class="fine" style="margin-top:8px; color:var(--ink-soft)">${txCount} transaction${txCount>1?'s':''} linked to this account.</div>` : ''}
        </div>
        <div class="modal-footer">
          <div>
            ${editId ? `<button class="btn btn-sm btn-danger" onclick="deleteAccount('${editId}')">Delete</button>` : ''}
          </div>
          <div style="display:flex; gap:8px">
            <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
            <button class="btn btn-sm btn-primary" onclick="saveAccount(${editId ? `'${editId}'` : 'null'})">Save</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = modalHTML;
}

async function saveAccount(editId) {
  const name = document.getElementById('acName').value.trim();
  const currency = document.getElementById('acCurrency').value;
  const opening = parseFloat(document.getElementById('acOpening').value) || 0;
  if (!name) { toast('Name required'); return; }

  // Prevent duplicate names
  const dup = state.accounts.find(a => a.name.toLowerCase() === name.toLowerCase() && a.id !== editId);
  if (dup) { toast('An account with that name already exists'); return; }

  try {
    if (editId) {
      await cloudUpdateAccount(editId, { name, currency, opening_balance: opening });
      // Update local state
      const idx = state.accounts.findIndex(a => a.id === editId);
      if (idx >= 0) state.accounts[idx] = { ...state.accounts[idx], name, currency };
      state.openingBalances[editId] = opening;
    } else {
      const created = await cloudCreateAccount({ name, currency, opening_balance: opening, sort_order: state.accounts.length });
      state.accounts.push({ id: created.id, name, currency });
      state.openingBalances[created.id] = opening;
    }
    closeModal();
    render();
    toast(editId ? 'Account updated' : 'Account added');
  } catch (err) {
    toast('Failed: ' + (err.message || 'unknown'));
  }
}

async function deleteAccount(id) {
  const acc = state.accounts.find(a => a.id === id);
  if (!acc) return;
  const txCount = state.transactions.filter(t => t.account === id).length;
  if (txCount > 0) {
    toast(`Cannot delete "${acc.name}" — ${txCount} transaction${txCount>1?'s':''} still linked. Reassign or delete them first.`);
    return;
  }
  if (!confirm(`Delete account "${acc.name}"?`)) return;
  try {
    await cloudDeleteAccount(id);
    state.accounts = state.accounts.filter(a => a.id !== id);
    delete state.openingBalances[id];
    closeModal();
    render();
    toast('Account deleted');
  } catch (err) {
    toast('Failed: ' + (err.message || 'unknown'));
  }
}

async function addIncomeType() {
  const name = prompt('New income category:');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  if (state.incomeTypes.includes(trimmed)) { toast('Already exists'); return; }
  try {
    await cloudCreateCategory(trimmed, 'income');
    state.incomeTypes.push(trimmed);
    render();
    toast('Added');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function renameIncomeType(oldName) {
  const name = prompt('Rename income category:', oldName);
  if (!name || !name.trim() || name === oldName) return;
  const trimmed = name.trim();
  if (state.incomeTypes.includes(trimmed)) { toast('Name already in use'); return; }
  const i = state.incomeTypes.indexOf(oldName);
  if (i < 0) return;
  try {
    await cloudRenameCategory(oldName, trimmed, 'income');
    state.incomeTypes[i] = trimmed;
    state.transactions.forEach(tx => {
      if (tx.type === 'income' && tx.category === oldName) tx.category = trimmed;
    });
    render();
    toast('Renamed');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

async function deleteIncomeType(name) {
  const txCount = state.transactions.filter(tx => tx.type === 'income' && tx.category === name).length;
  if (txCount > 0) {
    toast(`Cannot delete: ${txCount} income transaction${txCount > 1 ? 's' : ''} use this category. Rename them first.`);
    return;
  }
  if (!confirm(`Delete income category "${name}"?`)) return;
  try {
    await cloudDeleteCategory(name, 'income');
    state.incomeTypes = state.incomeTypes.filter(t => t !== name);
    render();
    toast('Deleted');
  } catch (err) {
    toast('Failed: ' + err.message);
  }
}

// ------------- FORECAST -------------
function renderForecast() {
  const year = currentYear();
  const { expenses, income } = monthlyTotals(year);
  const forecast = forecastSpend(year);
  const main = document.getElementById('main');

  if (forecast.lastActual < 0) {
    main.innerHTML = `<div class="card"><div class="card-title">Forecast</div><p>Need at least one month of spending data to forecast.</p></div>`;
    return;
  }

  // Projected balance trajectory
  const avgIncome = income.slice(0, forecast.lastActual + 1).reduce((s, x) => s + x, 0) / forecast.monthsCount;
  const avgExp = forecast.totalAvgMonthly;
  const projBalance = [];
  let running = totalBalanceAtMonth(forecast.lastActual, year);
  for (let m = 0; m < 12; m++) {
    if (m <= forecast.lastActual) {
      projBalance.push(totalBalanceAtMonth(m, year));
    } else {
      running += (avgIncome - avgExp);
      projBalance.push(running);
    }
  }
  const eoyBalance = projBalance[11];
  const savings = eoyBalance - totalBalanceAtMonth(-1, year);

  const sortedCats = Object.entries(forecast.perCategory).sort((a, b) => b[1].avgMonthly - a[1].avgMonthly);
  const totalAvg = sortedCats.reduce((s, [, v]) => s + v.avgMonthly, 0);

  main.innerHTML = `
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-label">Based on</div>
        <div class="stat-value">${forecast.monthsCount} month${forecast.monthsCount > 1 ? 's' : ''}</div>
        <div class="fine">Jan – ${MONTHS[forecast.lastActual]}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg monthly spend</div>
        <div class="stat-value" style="color:var(--red)">${fmtEUR(avgExp)}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg monthly income</div>
        <div class="stat-value" style="color:var(--green)">${fmtEUR(avgIncome)}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Projected EOY balance</div>
        <div class="stat-value serif">${fmtEUR(eoyBalance)}</div>
        <div class="fine">${savings >= 0 ? '+' : ''}${fmtEUR(savings)} this year</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Projected balance <span class="card-title-sub">actuals + forecast</span></div>
      <div class="chart-wrap-lg"><canvas id="chartProj"></canvas></div>
    </div>

    <div class="grid-2" style="margin-top:16px">
      <div class="card">
        <div class="card-title">Category burn rate <span class="card-title-sub">€ / month average</span></div>
        ${sortedCats.map(([c, v]) => {
          const pct = totalAvg ? (v.avgMonthly / totalAvg * 100) : 0;
          const remaining = (11 - forecast.lastActual) * v.avgMonthly;
          return `<div class="cat-row">
            <div>${c}<div class="fine">€${fmtNum(remaining)} expected thru year-end</div></div>
            <div class="amt">${fmtEUR(v.avgMonthly)}</div>
            <div class="tag-n">${pct.toFixed(0)}%</div>
            <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%"></div></div>
          </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="card-title">Year outlook <span class="card-title-sub">projected spend</span></div>
        <div class="chart-wrap"><canvas id="chartYearProj"></canvas></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">Forecast notes</div>
      <p>The forecast assumes you'll continue spending at your current <strong>average monthly rate of ${fmtEUR(avgExp)}</strong> across ${sortedCats.length} categories. Income is projected at <strong>${fmtEUR(avgIncome)}/month</strong>, giving a net savings rate of <strong>${fmtEUR(avgIncome - avgExp)}/month</strong>.</p>
      <p style="margin-top:10px" class="fine">Projections update automatically as you add more transactions. Based on ${forecast.monthsCount} completed month${forecast.monthsCount > 1 ? 's' : ''}.</p>
    </div>
  `;

  // Projected balance chart
  new Chart(document.getElementById('chartProj'), {
    type: 'line',
    data: {
      labels: MONTHS_SHORT,
      datasets: [
        {
          label: 'Actual',
          data: projBalance.map((v, i) => i <= forecast.lastActual ? v : null),
          borderColor: '#1d3557', backgroundColor: 'rgba(29,53,87,0.08)',
          fill: true, tension: 0.3, borderWidth: 2.5, pointRadius: 3
        },
        {
          label: 'Projected',
          data: projBalance.map((v, i) => i >= forecast.lastActual ? v : null),
          borderColor: '#e09f3e', backgroundColor: 'rgba(224,159,62,0.08)',
          fill: true, tension: 0.3, borderWidth: 2.5, pointRadius: 3, borderDash: [6, 4]
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Inter Tight', size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmtEUR(ctx.parsed.y) } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } },
        y: { grid: { color: '#f0ead9' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, callback: (v) => fmtEUR(v, {noSymbol: true}) } }
      }
    }
  });

  // Year overview - actual vs projected bars
  new Chart(document.getElementById('chartYearProj'), {
    type: 'bar',
    data: {
      labels: MONTHS_SHORT,
      datasets: [
        {
          label: 'Actual',
          data: expenses.map((v, i) => i <= forecast.lastActual ? v : null),
          backgroundColor: '#c44536', borderRadius: 2
        },
        {
          label: 'Projected',
          data: forecast.perMonth.map((v, i) => i > forecast.lastActual ? v : null),
          backgroundColor: 'rgba(224,159,62,0.7)', borderRadius: 2
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Inter Tight', size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => ctx.dataset.label + ': ' + fmtEUR(ctx.parsed.y) } }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'JetBrains Mono', size: 10 } } },
        y: { grid: { color: '#f0ead9' }, ticks: { font: { family: 'JetBrains Mono', size: 10 }, callback: (v) => fmtEUR(v, {noSymbol: true}) } }
      }
    }
  });
}

let pendingTxType = 'expense';
function setTxType(type) {
  pendingTxType = type;
  // Redraw fields
  const editBtns = document.querySelectorAll('.modal .segment button');
  editBtns.forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === type));

  const catSel = document.getElementById('txCategory');
  if (type === 'expense') {
    catSel.innerHTML = Object.keys(state.categories).map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('subField').style.display = '';
    // Refresh subs
    const subs = state.categories[catSel.value] || [];
    document.getElementById('txSub').innerHTML = '<option value="">—</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
  } else {
    catSel.innerHTML = state.incomeTypes.map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('subField').style.display = 'none';
  }
}
function getCurrentTxType() { return pendingTxType; }

async function saveTx(editId) {
  const type = pendingTxType;
  const tx = {
    date: document.getElementById('txDate').value,
    type,
    amount: parseFloat(document.getElementById('txAmount').value) || 0,
    currency: document.getElementById('txCurrency').value,
    category: document.getElementById('txCategory').value,
    subcategory: type === 'expense' ? document.getElementById('txSub').value : '',
    account: document.getElementById('txAccount').value,
    comment: document.getElementById('txComment').value,
  };
  if (!tx.amount || !tx.date) { toast('Date and amount required'); return; }

  // Normalize sign for adjustments: allow negative entry in UI
  if (type === 'adjustment') {
    // For adjustment, accept the raw amount (can be negative or positive)
    tx.amount = parseFloat(document.getElementById('txAmount').value);
  } else {
    tx.amount = Math.abs(tx.amount);
  }

  // FX rate handling:
  // - If USD and no stored rate exists (new tx), fetch the rate for this date
  // - Otherwise (editing), preserve the original rate unless currency changed
  if (tx.currency === 'USD') {
    if (editId) {
      const existing = state.transactions.find(t => t.id === editId);
      if (existing && existing.currency === 'USD' && existing.fx_rate != null) {
        tx.fx_rate = existing.fx_rate;
      } else {
        // Currency changed to USD or new tx - fetch rate
        tx.fx_rate = await fetchHistoricalFxRate(tx.date) || state.fxRate;
      }
    } else {
      tx.fx_rate = await fetchHistoricalFxRate(tx.date) || state.fxRate;
    }
  } else {
    tx.fx_rate = null;
  }

  try {
    if (editId) {
      await cloudUpdateTx(editId, tx);
      // Update local state
      state.transactions = state.transactions.map(t =>
        t.id === editId ? { ...tx, id: editId } : t
      );
    } else {
      const inserted = await cloudCreateTx(tx);
      // Add to local state (with the DB-assigned id)
      state.transactions.push({
        id: inserted.id,
        date: tx.date,
        type: tx.type,
        amount: tx.amount,
        currency: tx.currency,
        fx_rate: tx.fx_rate,
        category: tx.category,
        subcategory: tx.subcategory,
        account: tx.account,
        comment: tx.comment,
      });
    }
    closeModal();
    render();
    toast(editId ? 'Transaction updated' : 'Transaction added');
  } catch (err) {
    toast('Save failed: ' + err.message);
  }
}

async function deleteTx(id) {
  if (!confirm('Delete this transaction?')) return;
  try {
    await cloudDeleteTx(id);
    state.transactions = state.transactions.filter(t => t.id !== id);
    closeModal();
    render();
    toast('Deleted');
  } catch (err) {
    toast('Delete failed: ' + err.message);
  }
}

function openEditTx(id) {
  const tx = state.transactions.find(t => t.id === id);
  if (!tx) return;
  pendingTxType = tx.type;
  openAddTx(tx);
}

// Debounced FX rate save (don't hit the DB on every keystroke)
let _fxSaveTimer = null;
document.getElementById('fxRate').addEventListener('input', async (e) => {
  const v = parseFloat(e.target.value);
  if (!isFinite(v) || v <= 0) return;
  state.fxRate = v;
  render();
  clearTimeout(_fxSaveTimer);
  _fxSaveTimer = setTimeout(async () => {
    try { await cloudUpdateBudget({ fxRate: v }); }
    catch (err) { console.error('FX save failed', err); }
  }, 600);
});

document.getElementById('btnFetchFx').addEventListener('click', async () => {
  const btn = document.getElementById('btnFetchFx');
  const original = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const res = await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=EUR');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rate = data && data.rates && data.rates.EUR;
    if (!rate || !isFinite(rate)) throw new Error('Invalid rate');
    state.fxRate = Math.round(rate * 10000) / 10000;
    document.getElementById('fxRate').value = state.fxRate;
    await cloudUpdateBudget({ fxRate: state.fxRate });
    render();
    toast(`Updated: 1 USD = €${state.fxRate.toFixed(4)}`);
  } catch (err) {
    toast('Could not fetch live rate — ' + err.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
});

document.querySelectorAll('.nav-tab').forEach(t => {

    state.activeView = t.dataset.view;
    render();
  });
});
